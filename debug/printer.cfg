#####################################################################
# 单文件调试基础配置（新机器上电调试用）
#
# 内容：XYZ 运动、涡流探针、三点调平、网床、简单的打印头（挤出机/风扇）。
# 不引用任何其它文件，直接复制为 ~/printer_data/config/printer.cfg 使用。
# 参数取自正式配置（仓库 config/modules/），调试完成后换回正式配置。
#
# 使用说明：
#   1. 填写下面三块板子的 canbus_uuid（canbus_query.py can0 查询）。
#   2. 哪个硬件还没装/没接，就把对应整段注释掉（每段都标了【可选】或【必需】）。
#   3. 调试速度与加速度已降低，确认无误后再改回注释里的正式值。
#   4. 没有限位时可用 FORCE_MOVE / SET_KINEMATIC_POSITION 手动移动（已启用 force_move）。
#   5. SAVE_CONFIG 会把校准结果自动追加到本文件最底部。
#####################################################################


#####################################################################
# MCU【必需】
#####################################################################
[mcu]
canbus_uuid: 63e174b3ddf4             # 【必改】主板 CAN UUID
# serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_0C001F001850344D30353320-if00   # USB 连接时用这一行

[mcu toolhead]
canbus_uuid: 02ae2f8018ca             # 【必改】TGL36V3 工具头 CAN UUID


#####################################################################
# 运动学【必需】
#####################################################################
[printer]
kinematics: corexy
max_velocity: 200                     # 调试值；正式值 500
max_accel: 3000                       # 调试值；正式值 10000
max_z_velocity: 10
max_z_accel: 200                      # 涡流 tap 需要；原 50 会报 insufficient lift

# 允许未归零时手动移动电机（FORCE_MOVE / SET_KINEMATIC_POSITION）
[force_move]
enable_force_move: true

[respond]

# Mainsail / Fluidd 网页界面需要
[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]


#####################################################################
# X / Y【必需】
#####################################################################
[stepper_x]
step_pin: PC8
dir_pin: !PC7                         # 方向反了就加/去掉 !
enable_pin: !PC13
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
position_min: 0
position_max: 290
position_endstop: 290
homing_speed: 50                      # 调试值；正式值 100
homing_retract_dist: 5
second_homing_speed: 5
homing_positive_dir: true
endstop_pin: ^toolhead:PA3            # X 限位在工具头板；接主板时改为 ^!PC3

[tmc2209 stepper_x]
uart_pin: PC6
run_current: 0.800
hold_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PD2
dir_pin: PC12                         # 方向反了就加/去掉 !
enable_pin: !PC13
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
position_min: 0
position_max: 300
position_endstop: 300
homing_speed: 50                      # 调试值；正式值 100
homing_retract_dist: 5
second_homing_speed: 5
homing_positive_dir: true
endstop_pin: ^PC1

[tmc2209 stepper_y]
uart_pin: PB3
run_current: 0.800
hold_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
# 三 Z 丝杆【必需】
#   三个 Z 电机必须同向：逐个 STEPPER_BUZZ STEPPER=stepper_z / z1 / z2 检查
#####################################################################
[stepper_z]
step_pin: PA15
dir_pin: PB5
enable_pin: !PC13
microsteps: 32
rotation_distance: 32
full_steps_per_rotation: 200
gear_ratio: 64:16
endstop_pin: probe:z_virtual_endstop  # 用涡流探针做 Z 限位
# endstop_pin: ^PA0                   # 没有涡流探针时改用物理限位（同时启用下一行，并注释掉探针、调平、网床段）
# position_endstop: 0
position_min: -3
position_max: 250
homing_speed: 30
homing_retract_dist: 2
homing_retract_speed: 10
second_homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PB6
interpolate: True
run_current: 0.400
hold_current: 0.200
sense_resistor: 0.110
stealthchop_threshold: 99999

[stepper_z1]
step_pin: PA4
dir_pin: PA3
enable_pin: !PC13
microsteps: 32
rotation_distance: 32
full_steps_per_rotation: 200
gear_ratio: 64:16

[tmc2209 stepper_z1]
uart_pin: PB1
interpolate: True
run_current: 0.400
hold_current: 0.200
sense_resistor: 0.110
stealthchop_threshold: 99999

[stepper_z2]
step_pin: PB0
dir_pin: PC5
enable_pin: !PC13
microsteps: 32
rotation_distance: 32
full_steps_per_rotation: 200
gear_ratio: 64:16

[tmc2209 stepper_z2]
uart_pin: PC4
interpolate: True
run_current: 0.400
hold_current: 0.200
sense_resistor: 0.110
stealthchop_threshold: 99999

[safe_z_home]
home_xy_position: 125, 125            # Z 归零时喷嘴位置（探针在 Y+20）
speed: 50
z_hop: 5                              # 调试时先抬 5mm 再移动，防止刮床
z_hop_speed: 5


#####################################################################
# 打印头：挤出机与热端【可选】
#   没接热敏时整段注释掉（含 tmc2209 extruder 和 hotend_fan），否则会报错停机
#####################################################################
[extruder]
step_pin: toolhead:PB3
dir_pin: !toolhead:PA15
enable_pin: !toolhead:PB5
microsteps: 16
rotation_distance: 22.23
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: toolhead:PA6
sensor_type: Generic 3950
sensor_pin: toolhead:PA4
pullup_resistor: 4700
max_power: 1
control: pid
pid_Kp: 26.374                        # 实测 220°C（2026-10-20）；换热端后重新 PID_CALIBRATE HEATER=extruder TARGET=220
pid_Ki: 6.279
pid_Kd: 27.693
min_temp: 0
max_temp: 300
min_extrude_temp: 170                 # 防止冷挤出
max_extrude_cross_section: 30
max_extrude_only_distance: 200

[tmc2209 extruder]
uart_pin: toolhead:PB4
run_current: 0.4
hold_current: 0.200
sense_resistor: 0.110
stealthchop_threshold: 999999

[heater_fan hotend_fan]
pin: toolhead:PA0
heater: extruder
heater_temp: 50.0
max_power: 1
kick_start_time: 0.5
fan_speed: 1
shutdown_speed: 1

# 模型冷却风扇（M106 / M107）
[fan]
pin: toolhead:PA1


#####################################################################
# 热床【可选】没接热床或热床热敏时整段注释掉
#####################################################################
# [heater_bed]
# heater_pin: PA10
# sensor_type: Generic 3950
# sensor_pin: PC2
# pullup_resistor: 4700
# max_power: 1
# control: pid
# pid_kp: 66.529              # 实测 80°C（2026-10-20）
# pid_ki: 4.669
# pid_kd: 237.011
# min_temp: 0
# max_temp: 120


#####################################################################
# 涡流探针（小螃蟹 LDC1612，工具头 I2C）【调平必需】
#   首次使用：LDC_CALIBRATE_DRIVE_CURRENT CHIP=eddy_probe → SAVE_CONFIG
#            PROBE_EDDY_CURRENT_CALIBRATE_AUTO（垫纸，TESTZ 调整后 ACCEPT）→ SAVE_CONFIG
#   需先按 Klipper 源码修改说明改 klippy/extras/ldc1612.py（见正式配置 probe 模块注释）
#####################################################################
[probe_eddy_current eddy_probe]
sensor_type: ldc1612
i2c_mcu: toolhead
i2c_address: 42
i2c_speed: 400000
i2c_software_scl_pin: toolhead:PB6
i2c_software_sda_pin: toolhead:PB7
frequency: 40000000
max_sensor_hz: 7000000
x_offset: 0
y_offset: 20                          # 探针在喷嘴后方 20mm
descend_z: 2
speed: 5
samples: 3
sample_retract_dist: 5.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
tap_z_offset: 0


#####################################################################
# 三点调平【可选，需要探针】
#   points 是喷嘴坐标，探针实际位置在 Y+20；测点离热床边缘至少 30mm
#####################################################################
[z_tilt]
z_positions:
  -6.5, -2                            # 左前丝杆 (stepper_z)
  150, 350                            # 后中丝杆 (stepper_z1)
  335, -2                             # 右前丝杆 (stepper_z2)
points:
  40, 40                              # 左前，探针在 40,60
  150, 200                            # 后中，探针在 150,220（不要用 260：探针到 Y=280 靠近边缘，读数偏低）
  260, 40                             # 右前，探针在 260,60
speed: 100
horizontal_move_z: 10
retry_tolerance: 0.0075
retries: 20


#####################################################################
# 网床【可选，需要探针】
#####################################################################
[bed_mesh]
speed: 100
horizontal_move_z: 2
mesh_min: 25, 25                      # 探针坐标
mesh_max: 275, 260                    # Y 不超过 260，避开热床后边缘
probe_count: 7, 7
algorithm: bicubic
scan_overshoot: 8


#####################################################################
# 调试宏
#####################################################################
# 涡流首次校准：喷嘴移到 X20 Y40（Y 需大于 y_offset，否则 ACCEPT 后超行程）
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
description: 涡流探针首次校准（垫纸，TESTZ 调整后 ACCEPT）
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90
  G1 X20 Y40 F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 }
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE CHIP=eddy_probe

# 调平：先粗调再用涡流快速扫描精调
[gcode_macro Z_TILT_ADJUST]
description: 涡流三点调平（粗调 + 快速扫描精调）
rename_existing: _Z_TILT_ADJUST
gcode:
  {% set Z = printer.configfile.settings['probe_eddy_current eddy_probe'].descend_z|float %}
  BED_MESH_CLEAR
  {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST horizontal_move_z=4 retry_tolerance=1 SAMPLES=1
  {% endif %}
  _Z_TILT_ADJUST horizontal_move_z={Z} retry_tolerance=0.0075 retries=20 METHOD=rapid_scan ADAPTIVE=1
  G90
  G0 Z5 F300

# 网床：涡流快速扫描
[gcode_macro BED_MESH_CALIBRATE]
description: 涡流快速网床
rename_existing: _BED_MESH_CALIBRATE
gcode:
  {% set Z = printer.configfile.settings['probe_eddy_current eddy_probe'].descend_z|float %}
  _BED_MESH_CALIBRATE horizontal_move_z={Z} METHOD=rapid_scan {rawparams}

# 一键：归零 → 调平 → 重新 Z 归零 → 扫床
[gcode_macro LEVEL_ALL]
description: 归零、三点调平、重新 Z 归零、扫网床
gcode:
  G28
  Z_TILT_ADJUST
  G28 Z
  BED_MESH_CALIBRATE

# 塞尺测试：PAPER_TEST POINT=1左前 2右前 3左后 4右后，喷嘴降到 Z=0.2
[gcode_macro PAPER_TEST]
description: 塞尺测试，POINT=1左前 2右前 3左后 4右后（先执行 LEVEL_ALL 后 BED_MESH_CLEAR）
gcode:
  {% set points = {1: [40, 40], 2: [250, 40], 3: [40, 270], 4: [250, 270]} %}
  {% set p = params.POINT|default(1)|int %}
  {% if p not in points %}
    {action_raise_error("POINT 只能是 1~4")}
  {% endif %}
  G90
  G1 Z1 F600
  G1 X{points[p][0]} Y{points[p][1]} F6000
  G1 Z0.2 F300
  RESPOND MSG="点{p} X{points[p][0]} Y{points[p][1]} Z=0.2, 请用塞尺测试"
