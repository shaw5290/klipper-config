sense_resistor: 0.110       #驱动采样电阻值（不要修改）
stealthchop_threshold: 99999   #改成0可跑高速，但电机会有电流声，改成99999可静音但不能跑高速，否则会丢步或者嘎嘎响

[tmc2209 stepper_z2]
uart_pin: PC4               #RX
interpolate: True           #开启插值=256细分
run_current: 0.400          #电机电流
hold_current: 0.200         #电机静态力矩保持电流值
sense_resistor: 0.110       #驱动采样电阻值（不要修改）
stealthchop_threshold: 99999   #改成0可跑高速，但电机会有电流声，改成99999可静音但不能跑高速，否则会丢步或者嘎嘎响



