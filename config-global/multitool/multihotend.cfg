#####################################################################
# multihotend MCU 温度
#####################################################################
# 显示 multihotend MCU 板载温度
[temperature_sensor multihotend温度]
sensor_type: temperature_mcu                        # 使用 Klipper 内置 MCU 温度传感器
sensor_mcu: multihotend                             # 读取 [mcu multihotend] 的 MCU 温度
min_temp: -210                                         # MCU 最低安全温度
max_temp: 100                                       # MCU 最高安全温度，超过会报错保护

#####################################################################
# 挤出机 / 热端
#####################################################################
#####################################################################
# 多热端模式：T0 使用物理挤出机，T1..Tn 仅做温度管理
#####################################################################
# T0 的 Klipper extruder section；T0 名称固定为 extruder

[extruder]
# step_pin:toolhead:PB3  # 步进脉冲信号引脚（高电平触发运动）
# dir_pin:!toolhead:PA15   # 方向控制引脚（!表示方向逻辑反转）
# enable_pin:!toolhead:PB5 # 电机使能引脚（低电平有效） 
# microsteps:16  # 细分设置（精度调整，常见值16/32/64）
# rotation_distance:22.23 # 挤出机每转挤料距离（mm/rev）
# #full_steps_per_rotation:200  # 电机固有参数（42步进电机一般为200）

# # 系统传动比例（输入齿轮齿数:输出齿轮齿数）
# gear_ratio:50:10 # BMG减速比配置（输入轴50齿，输出轴10齿）
# filament_diameter:1.75 # 线材直径（影响流量计算，务必准确）
# heater_pin:toolhead:PA6 # 加热棒控制引脚（MOSFET驱动）
# sensor_type:Generic 3950 # 热敏传感器型号（常见型号：EPCOS 100K B=3950）
# sensor_pin:toolhead:PA4  # 热敏传感器信号引脚（需接上拉电阻）

# # 喷嘴参数
# nozzle_diameter:0.400 # 喷嘴直径（影响挤出量计算）
# max_power:1 # 加热棒最大功率比例（0~1范围）

# # 温度控制安全限制
# min_extrude_temp:-119 # 允许挤出的最低温度（-120表示禁用保护）
# min_temp:-120 # 最低温度告警阈值
# max_temp:300  # 最高温度保护阈值

# # PID自动调谐参数（需通过`PID_CALIBRATE`命令校准）
# control:pid 
# pid_Kp:32.031 # 比例系数（响应速度）
# pid_Ki:13.347 # 积分系数（消除稳态误差）
# pid_Kd:19.218 # 微分系数（抑制超调）

# # 流量控制参数
# pullup_resistor:4700  # 热敏上拉电阻阻值（单位：Ω）
# max_extrude_cross_section:30 # 最大挤出截面积（mm²）
# max_extrude_only_distance:1000 # 单次挤出最大长度（毫米）
# pressure_advance:0.03 # 压力提前补偿系数（需通过测试调整）
# pressure_advance_smooth_time:0.040 # 压力补偿平滑时间（秒）

[extruder]
step_pin: toolhead:PB3   # 【必改】挤出机步进 STEP 引脚
dir_pin: !toolhead:PA15     # 【必改】挤出机步进 DIR 引脚；方向相反时在引脚前加/去掉 !
enable_pin: !toolhead:PB5 # 【必改】挤出机步进 ENABLE 引脚；常见为 ! 开头
microsteps: 32                                      # 挤出机细分；需与驱动配置一致
full_steps_per_rotation: 200                        # 电机每圈整步数；1.8 度电机通常为 200
rotation_distance: 22.987 # 【必改】挤出机 rotation_distance，按实际挤出机构校准
filament_diameter: 1.750                            # 耗材直径；常见 1.75mm 耗材填 1.750
heater_pin: multihotend:T0H                                    # T0 加热棒 MOSFET 输出引脚；实际 MCU 引脚在 [board_pins multihotend] 中填写
nozzle_diameter: 0.400                              # 喷嘴直径；需与实际喷嘴和切片器一致
smooth_time: 0.4                                    # 温度平滑时间；默认值通常可用
min_temp: -210                                     # 允许的最低温度；热敏异常低于此值会报错
max_temp: 9999                                       # 允许的最高温度；按热端安全上限调整
sensor_type: Generic 3950                           # 热敏类型默认 Generic 3950；如果实际不是 3950，请改成 PT1000 等对应类型
sensor_pin: multihotend:T0S                                     # T0 热敏输入引脚；实际 MCU 引脚在 [board_pins multihotend] 中填写
control: pid                                        # 默认使用 PID 控温；首次使用前建议执行 PID_CALIBRATE 重新校准
pid_kp: 26.213                                      # 默认 PID Kp 占位值；PID 校准后替换为 SAVE_CONFIG 输出值
pid_ki: 1.304                                       # 默认 PID Ki 占位值；PID 校准后替换为 SAVE_CONFIG 输出值
pid_kd: 131.721                                     # 默认 PID Kd 占位值；PID 校准后替换为 SAVE_CONFIG 输出值
max_power: 0.5                                      # 加热最大功率比例；0.9 表示最高 90%
pressure_advance: 0.000                             # 压力提前；按耗材和挤出机校准，0 表示关闭
max_extrude_only_distance: 400                      # 允许纯挤出最大长度；换料/排料动作可能需要较大值
min_extrude_temp: 170                               # 低于该温度禁止挤出，防止冷挤出损坏挤出机



# T0 挤出机 TMC2209 驱动配置
# [tmc2209 extruder]
# uart_pin: toolhead:PB7   # 【必改】TMC UART 通讯引脚
# interpolate: True                                  # 是否启用 256 细分插值；高速挤出通常建议关闭
# run_current: 0.500                                   # 驱动运行电流，按电机额定电流和散热调整
# sense_resistor: 0.110                               # 驱动采样电阻；按驱动模块实际值填写
# stealthchop_threshold: 99999                            # 0 表示挤出机使用 spreadCycle，通常更稳

