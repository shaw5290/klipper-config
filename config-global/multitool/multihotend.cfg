#####################################################################
# Multihotend 配置模板
#
# 此文件由 install.sh 自动生成。
# 扩展板型号：通用自定义多热端板
# 重要：请替换所有 TODO_* 占位，并填写 [board_pins multihotend] 中等号后的真实 MCU 引脚。
# 完成配置后再重启 Klipper。
#####################################################################

# 多热端扩展板 MCU，名称固定为 multihotend
[mcu multihotend]
# canbus_uuid: TODO_CANBUS_UUID                       # 【必改】扩展板 CAN UUID，可用 ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0 查询
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_3C002A001451564839383020-if00       # usb固件连接时开启这一行

# 为 multihotend MCU 定义引脚别名，便于后续引用
[board_pins multihotend]
mcu: multihotend                                    # 这些别名属于上面的 [mcu multihotend]
aliases:                                            # 【必改】填写等号后的真实 MCU 引脚；别名名称保持不变
    T7H=PB7,T7S=PA2,IO7=PC14,
    T6H=PB6,T6S=PA1,IO6=PC13,
    T5H=PB5,T5S=PA4,IO5=PB2,
    T4H=PB4,T4S=PA3,IO4=PA15,
    T3H=PB3,T3S=PA6,IO3=PB12,
    T2H=PB13,T2S=PA5,IO2=PA10,
    T1H=PB14,T1S=PA7,IO1=PA9,
    T0H=PB15,T0S=PB1,IO0=PA8

#####################################################################
# 风扇
#####################################################################
# T0 独立停靠坞风扇，只监听 extruder
[heater_fan dock_fan_t0]
pin: multihotend:IO0                            # 【必改】T0 dock_fan 风扇输出引脚
max_power: 1.0                                      # 风扇最大功率比例，1.0 表示 100%
kick_start_time: 0.5                                # 风扇启动助推时间，防止低速不转
heater: extruder                                     # 只监听当前工具对应的热端
heater_temp: 50                                     # 当前热端超过 50°C 时启动风扇
fan_speed: 0.9                                      # 风扇运行速度，0.9 表示 90%

