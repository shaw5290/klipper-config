#####################################################################
# 模块：单头挤出机（使用多热端扩展板的 T0 热端）
#
# 单头的第二种接法：挤出电机在 TGL36V3 工具头板上，
# 加热棒和热敏接在多热端扩展板的 T0 口（T0H / T0S）。
# 与 extruder/tgl36v3_single.cfg（热端接工具头 CAN 板）二选一。
# 内容取自 multitool/multihotend.cfg 的扩展板 MCU、引脚别名和 T0 [extruder]，
# 温度保护改为 0～300°C；PID 为 T0 实测值（150°C）。
#
# 依赖：toolhead/tgl36v3.cfg（挤出电机驱动 [tmc2209 extruder]）
# 提供：[mcu multihotend] [board_pins multihotend] [extruder]
#####################################################################

# 多热端扩展板 MCU，名称固定为 multihotend
[mcu multihotend]
# canbus_uuid: TODO_CANBUS_UUID                       # 【必改】扩展板 CAN UUID，可用 ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0 查询
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_3C002A001451564839383020-if00       # usb固件连接时开启这一行

# 为 multihotend MCU 定义引脚别名，便于后续引用
[board_pins multihotend]
mcu: multihotend                                    # 这些别名属于上面的 [mcu multihotend]
aliases:                                            # 【必改】填写等号后的真实 MCU 引脚；别名名称保持不变
    T7H=PB7,T7S=PA2,IO7=PC14,
    T6H=PB6,T6S=PA1,IO6=PC13,
    T5H=PB5,T5S=PA4,IO5=PB2,
    T4H=PB4,T4S=PA3,IO4=PA15,
    T3H=PB3,T3S=PA6,IO3=PB12,
    T2H=PB13,T2S=PA5,IO2=PA10,
    T1H=PB14,T1S=PA7,IO1=PA9,
    T0H=PB15,T0S=PB1,IO0=PA8

[temperature_sensor multihotend温度]
sensor_type: temperature_mcu                        # 使用 Klipper 内置 MCU 温度传感器
sensor_mcu: multihotend                             # 读取 [mcu multihotend] 的 MCU 温度
min_temp: -210                                         # MCU 最低安全温度
max_temp: 100                                       # MCU 最高安全温度，超过会报错保护

[extruder]
step_pin: toolhead:PB3   # 【必改】挤出机步进 STEP 引脚
dir_pin: !toolhead:PA15     # 【必改】挤出机步进 DIR 引脚；方向相反时在引脚前加/去掉 !
enable_pin: !toolhead:PB5 # 【必改】挤出机步进 ENABLE 引脚；常见为 ! 开头
microsteps: 32                                      # 挤出机细分；需与驱动配置一致
full_steps_per_rotation: 200                        # 电机每圈整步数；1.8 度电机通常为 200
rotation_distance: 22.987 # 【必改】挤出机 rotation_distance，按实际挤出机构校准
filament_diameter: 1.750                            # 耗材直径；常见 1.75mm 耗材填 1.750
heater_pin: multihotend:T0H                                    # T0 加热棒 MOSFET 输出引脚；实际 MCU 引脚在 [board_pins multihotend] 中填写
nozzle_diameter: 0.400                              # 喷嘴直径；需与实际喷嘴和切片器一致
smooth_time: 0.4                                    # 温度平滑时间；默认值通常可用
min_temp: 0                                        # 允许的最低温度；热敏断线读数会低于此值并报错
max_temp: 300                                        # 允许的最高温度；按热端安全上限调整
sensor_type: Generic 3950                           # 热敏类型默认 Generic 3950；如果实际不是 3950，请改成 PT1000 等对应类型
sensor_pin: multihotend:T0S                                     # T0 热敏输入引脚；实际 MCU 引脚在 [board_pins multihotend] 中填写
control: pid                                        # 默认使用 PID 控温；首次使用前建议执行 PID_CALIBRATE 重新校准
pid_kp: 23.270                                      # T0 实测：PID_CALIBRATE HEATER=extruder TARGET=150（2026-10-20）
pid_ki: 7.757                                      # T0 实测：PID_CALIBRATE HEATER=extruder TARGET=150（2026-10-20）
pid_kd: 17.452                                      # T0 实测：PID_CALIBRATE HEATER=extruder TARGET=150（2026-10-20）
max_power: 0.5                                      # 加热最大功率比例；0.9 表示最高 90%
pressure_advance: 0.000                             # 压力提前；按耗材和挤出机校准，0 表示关闭
max_extrude_only_distance: 400                      # 允许纯挤出最大长度；换料/排料动作可能需要较大值
min_extrude_temp: 170                               # 低于该温度禁止挤出，防止冷挤出损坏挤出机
