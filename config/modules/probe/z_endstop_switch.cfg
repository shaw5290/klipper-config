#####################################################################
# 模块：Z 物理限位开关（不使用涡流探针时的替代模块）
#
# Z 轴使用主板 PA0 物理限位。与 probe/eddy_tgl36v3.cfg 二选一。
# 使用本模块时，调平与网床模块需要另有探针才能工作。
#
# 依赖：core/z_trident.cfg
# 提供：Z 限位
#####################################################################

[stepper_z]
endstop_pin: ^PA0                       #Z轴物理限位开关引脚
position_endstop: 0                     #限位触发时的位置
