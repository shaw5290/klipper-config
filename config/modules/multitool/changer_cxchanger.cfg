#####################################################################
# 模块：换头方案 CxChanger
#
# 停靠坞参数、放回/抓取动作，以及插件调用的两个钩子宏。
# 更换换头方案时，只替换本模块。
#
# 依赖：multitool/multitool_plugin.cfg
# 提供：multitool_release_tool / multitool_pickup_tool / _release_tool / _pickup_tool / DOCK_TUNE（调试弹窗）
#####################################################################

#####################################################################
# CxChanger 换头路径模板
#
# 方案来源:
#   https://github.com/cx330-TXY/CxChanger
#
# 安装脚本选择 CxChanger 时会复制本文件到：
#   ~/printer_data/config/multitool/change_tool.cfg
#
# 使用前必须按机器实测修改：
#   - 每个工具的 dock_x / dock_y
#   - dock_shift_x / dock_dodge_y / dock_safe_y
#   - feed_safe / feed_fast / feed_slow
#####################################################################


#####################################################################
# 停靠坞参数集中管理
#####################################################################
# CxChanger 方案的所有停靠坞参数集中放在这个宏变量容器中
[gcode_macro _multitool_cfg]
description: 【换头】CxChanger 停靠坞参数（坐标、横移、避让、速度），仅存放变量

# --- 速度 ---
# 调试速度：新调坐标、改 dock 参数后先用这组，看到没对齐来得及点急停
variable_feed_safe:        3000     # 安全区域快速移动速度，单位 mm/min
variable_feed_fast:        600      # 进入/退出停靠坞的常规速度，单位 mm/min
variable_feed_slow:        200      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min
# 正常速度：调试速度下连续换头无撞击后，注释上面三行、取消下面三行注释
#variable_feed_safe:        15000    # 安全区域快速移动速度，单位 mm/min
#variable_feed_fast:        1200     # 进入/退出停靠坞的常规速度，单位 mm/min
#variable_feed_slow:        400      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min

# --- 停靠坞运动逻辑参数 ---
variable_dock_shift_x: -3        # X 方向横移距离，用于开合 CxChanger 摆臂；方向不对时改正负号
variable_dock_dodge_y: 14           # Y 方向避让距离，用于磁吸分离/结合前后的避让位置
variable_dock_safe_y:  30           # 每个 dock 前方安全入口距离，工具头先到这里再进入 dock

# --- 各热端停靠坞坐标：请按机器实测修改 ---
variable_t0_dock_x: 282.78              # 【必改】T0 停靠坞 X 坐标
variable_t0_dock_y: -27.90               # 【必改】T0 停靠坞 Y 坐标
variable_t1_dock_x: 248.30               # 【必改】T1 停靠坞 X 坐标
variable_t1_dock_y: -27.90               # 【必改】T1 停靠坞 Y 坐标
variable_t2_dock_x: 225.00               # 【必改】T2 停靠坞 X 坐标
variable_t2_dock_y: -27.90               # 【必改】T2 停靠坞 Y 坐标
variable_t3_dock_x: 190.10               # 【必改】T3 停靠坞 X 坐标
variable_t3_dock_y: -27.90               # 【必改】T3 停靠坞 Y 坐标
variable_t4_dock_x: 155.10               # 【必改】T4 停靠坞 X 坐标
variable_t4_dock_y: -27.90               # 【必改】T4 停靠坞 Y 坐标
variable_t5_dock_x: 120.60               # 【必改】T5 停靠坞 X 坐标
variable_t5_dock_y: -27.90               # 【必改】T5 停靠坞 Y 坐标
variable_t6_dock_x: 85.20               # 【必改】T6 停靠坞 X 坐标
variable_t6_dock_y: -27.90               # 【必改】T6 停靠坞 Y 坐标
variable_t7_dock_x: 49.90               # 【必改】T7 停靠坞 X 坐标
variable_t7_dock_y: -27.90               # 【必改】T7 停靠坞 Y 坐标
variable_t8_dock_x: 13.70               # 【必改】T8 停靠坞 X 坐标
variable_t8_dock_y: -27.90               # 【必改】T8 停靠坞 Y 坐标

gcode:
    # 仅作变量容器             # 保留空 gcode，避免 Klipper 认为宏无内容


#####################################################################
# 释放热端：将当前热端放回停靠坞
#####################################################################
# CxChanger 放回工具动作，由 multitool_release_tool 转发调用
[gcode_macro _release_tool]
description: 【换头】把热端放回停靠坞的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要放回的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 当前工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 当前工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸分离用 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在放回 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}          # 沿 Y 进入 dock 中心
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # Y 后退完成磁吸分离
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 回位闭合摆臂
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 抓取热端：从停靠坞抓起目标热端
#####################################################################
# CxChanger 抓取工具动作，由 multitool_pickup_tool 转发调用
[gcode_macro _pickup_tool]
description: 【换头】从停靠坞抓取热端的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要抓取的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 目标工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 目标工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸结合前的 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在抓取 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast} # 进入避让位置，准备开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # Y 前进让磁吸工具结合
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}           # X 回位闭合摆臂并锁定工具

    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 带着工具退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 2. 用户钩子：放回热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>，框架已做好 G90 / Z 抬升 / accel 切换 / 入口夹紧自检。
#    在这里写"把 T{tool} 热端放回坞"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_release_tool]
description: 【换头】插件钩子：放回热端，转发到 _release_tool
gcode:
    _release_tool TOOL={params.TOOL}

#####################################################################
# 2. 用户钩子：抓取热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>。
#    在这里写"从坞中抓起 T{tool} 热端"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_pickup_tool]
description: 【换头】插件钩子：抓取热端，转发到 _pickup_tool
gcode:
    _pickup_tool TOOL={params.TOOL}


#####################################################################
# 停靠坞调试：只有一个宏 DOCK_TUNE（打印时不会调用）
#
#   DOCK_TUNE TOOL=0     打开 T0 的调试弹窗，之后只点弹窗里的按钮
#
# 弹窗用 Klipper 的 action:prompt 协议（Mainsail 2.9 及以上、较新版本的 Fluidd）。
# 按钮都是调用 DOCK_TUNE A=<动作>；坐标从上面的 _multitool_cfg 读取，全程绝对坐标。
#
# 用法：
#   第一个头：在坞里调好横移（耗材完全松开、不撞），点"设为横移量"；之后所有头共用。
#   每个头：点"放回测试"→ 亲眼确认是否停靠；没停靠点"否 → X -0.1 再放回"，
#   成功点"是 → 抓回来"。弹窗自动记录每个进坞 X 的成败，两边都测到失败后点"设为进坞中心"。
#   最后点"连续取放"用换头插件跑几轮，确认后点"显示结果"，把值写进上面的 _multitool_cfg。
#
# 弹窗里改的值都是临时的（RESTART 后恢复成文件里的值）。
# 弹窗只记录"热端在打印头上还是在坞里"，每次放回、抓取后要人确认。
#####################################################################
[gcode_macro DOCK_TUNE]
description: 【换头】停靠坞调试弹窗（TOOL=工具号）：调进坞 X、横移量、后退距离、推入深度，测放回、抓取和连续取放
# 调试状态：sel=选中的工具；pos=1 在坞里；x/shift/back=本次进坞的 X、累计横移、累计后退；
# held=热端位置（1 打印头上，0 坞里，-1 放回后待确认，-2 抓取后待确认）；pend=2 抓取后等退出；
# test_x=刚放回测试的进坞 X；log=[[进坞X, 1成功/0失败], …]；lo/hi=耗材松开/撞击时的累计横移
variable_sel: 0
variable_pos: 0
variable_x: 0.0
variable_shift: 0.0
variable_back: 0.0
variable_held: 1
variable_pend: 0
variable_test_x: 0.0
variable_log: []
variable_lo: 0.0
variable_hi: 0.0
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set st = printer["gcode_macro DOCK_TUNE"] %}
    {% set a = params.A|default('open')|lower %}
    {% set d = params.D|default(0)|float %}
    {% set tool = params.TOOL|default(st.sel)|int if a == 'open' else st.sel|int %}
    {% if ('t%d_dock_x' % tool) not in cfg %}
        {action_raise_error("没有 T%d 的停靠坞参数" % tool)}
    {% endif %}
    {% set x = cfg['t%d_dock_x' % tool]|float %}
    {% set y = cfg['t%d_dock_y' % tool]|float %}
    {% set sh = cfg.dock_shift_x|float %}
    {% set dodge = cfg.dock_dodge_y|float %}
    {% set safe = (y + cfg.dock_safe_y|float)|round(3) %}
    {% set yd = (y + dodge)|round(3) %}
    {% set in_dock = st.pos|int == 1 %}
    {% set held = st.held|int %}
    {% set th = printer.toolhead %}
    {% set homed = 'x' in th.homed_axes and 'y' in th.homed_axes %}
    {% set V = 'SET_GCODE_VARIABLE MACRO=DOCK_TUNE VARIABLE=' %}

    # ---------- 动作前检查 ----------
    {% if a in ('go', 'release', 'pickup') %}
        {% if in_dock %}
            {action_raise_error("还在坞里，先点“退出坞”")}
        {% endif %}
        {% if homed and th.position.y < safe - 0.5 %}
            {action_raise_error("打印头在坞附近（Y=%.2f），先手动退到坞前 Y≥%.2f" % (th.position.y, safe))}
        {% endif %}
    {% endif %}
    {% if a in ('go', 'entry', 'release') and held < 0 %}
        {action_raise_error("先在弹窗里确认热端在哪（是否已停靠）")}
    {% endif %}
    {% if a in ('go', 'entry', 'release') and held == 0 %}
        {action_raise_error("热端在坞里，空打印头进坞会撞上它。先点“抓取测试”拿回来；状态记错了点“切换”")}
    {% endif %}
    {% if a in ('shift', 'shiftto', 'back', 'backto', 'out', 'lo', 'hi', 'setshift', 'setdodge', 'setdepth') and not in_dock %}
        {action_raise_error("先进坞")}
    {% endif %}
    {% if a in ('go', 'release', 'pickup', 'retry', 'okpick', 'again') and not homed %}
        G28 X Y
    {% endif %}

    # ---------- 动作 ----------
    {% if a == 'open' %}
        {% if in_dock and tool != st.sel|int %}
            {action_raise_error("还停在 T%d 的坞里，先点“退出坞”" % st.sel|int)}
        {% endif %}
        {% if tool != st.sel|int %}
            {V}log VALUE=[]
            {V}lo VALUE=0
            {V}hi VALUE=0
        {% endif %}
        {% if params.TOOL is defined and not in_dock %}
            {V}held VALUE=1
            {V}pend VALUE=0
        {% endif %}
        {V}sel VALUE={tool}

    {% elif a == 'go' %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G90
        G0 X{x} Y{safe} F{cfg.feed_safe}
        G0 X{x} Y{y} F{cfg.feed_slow}
        {V}pos VALUE=1
        {V}x VALUE={x}
        {V}shift VALUE=0
        {V}back VALUE=0

    {% elif a == 'entry' %}
        {% if in_dock %}
            {action_raise_error("在坞里不能改进坞 X，先点“退出坞”")}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_x VALUE={(x + d)|round(3)}

    {% elif a in ('shift', 'shiftto') %}
        {% set new = (sh if a == 'shiftto' else st.shift|float + d)|round(3) %}
        {% if new|abs > 6 %}
            {action_raise_error("累计横移 %.2f 超过 6 mm，停止" % new)}
        {% endif %}
        G90
        G0 X{(st.x|float + new)|round(3)} F{cfg.feed_slow}
        {V}shift VALUE={new}

    {% elif a in ('back', 'backto') %}
        {% set new = (dodge if a == 'backto' else st.back|float + d)|round(3) %}
        {% set ymin = th.axis_minimum.y|float %}
        {% if new > cfg.dock_safe_y|float or y + new < ymin + 0.5 %}
            {action_raise_error("后退 %.2f 超出范围：最多退 %.2f，最深推到 Y=%.2f" % (new, cfg.dock_safe_y|float, ymin + 0.5))}
        {% endif %}
        G90
        G0 Y{(y + new)|round(3)} F{cfg.feed_slow}
        {V}back VALUE={new}

    {% elif a == 'lo' %}
        {V}lo VALUE={st.shift|float}
    {% elif a == 'hi' %}
        {V}hi VALUE={st.shift|float}
    {% elif a == 'setshift' %}
        {% if st.shift|float == 0 %}
            {action_raise_error("先横移到合适位置")}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_shift_x VALUE={st.shift|float}
    {% elif a == 'setdodge' %}
        {% if st.back|float <= 0 %}
            {action_raise_error("先后退到热端分开的位置")}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_dodge_y VALUE={st.back|float}
    {% elif a == 'setdepth' %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_y VALUE={(y + st.back|float)|round(2)}
        {V}back VALUE=0

    {% elif a == 'out' %}
        G90
        G0 X{st.x|float} F{cfg.feed_slow}
        G0 Y{safe} F{cfg.feed_fast}
        {V}pos VALUE=0
        {% if st.pend|int == 2 %}
            {V}held VALUE=-2
            {V}pend VALUE=0
        {% elif st.back|float > 0 %}
            {V}held VALUE=-1
        {% endif %}

    {% elif a in ('release', 'retry', 'again') %}
        {% if a == 'retry' and (held != -1 or not st.test_x|float) %}
            {action_raise_error("只有放回后确认没停靠时才能用")}
        {% endif %}
        {% if a == 'again' and held != -2 %}
            {action_raise_error("只有抓取后确认热端在打印头上时才能用")}
        {% endif %}
        {% set log = st.log %}
        {% if a == 'retry' %}
            {% set log = log|rejectattr('0', 'equalto', st.test_x|float)|list + [[st.test_x|float, 0]] %}
            {% set rx = (st.test_x|float + d)|round(3) %}
            SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_x VALUE={rx}
        {% else %}
            {% set rx = x %}
        {% endif %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G90
        G0 X{rx} Y{safe} F{cfg.feed_safe}
        G0 X{rx} Y{y} F{cfg.feed_slow}
        G0 X{(rx + sh)|round(3)} F{cfg.feed_slow}
        G0 Y{yd} F{cfg.feed_slow}
        G0 X{rx} F{cfg.feed_slow}
        G0 Y{safe} F{cfg.feed_fast}
        {% set parts = [] %}
        {% for e in log %}
            {% set _ = parts.append('[%.3f,%d]' % (e[0], e[1])) %}
        {% endfor %}
        {V}log VALUE=[{parts|join(',')}]
        {V}test_x VALUE={rx}
        {V}held VALUE=-1
        {V}pos VALUE=0
        RESPOND MSG="DOCK_TUNE：在进坞 X {'%.2f' % rx} 放回完成，看一下 T{tool} 是否留在坞里，在弹窗里确认"

    {% elif a in ('pickup', 'okpick') %}
        {% if a == 'pickup' and held == 1 %}
            {action_raise_error("热端已经在打印头上，不需要抓取；状态记错了点“切换”")}
        {% endif %}
        {% if a == 'okpick' and held != -1 %}
            {action_raise_error("只有放回后确认已停靠时才能用")}
        {% endif %}
        {% set sx = (x + sh)|round(3) %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G90
        G0 X{x} Y{safe} F{cfg.feed_safe}
        G0 X{x} Y{yd} F{cfg.feed_fast}
        G0 X{sx} Y{yd} F{cfg.feed_slow}
        G0 X{sx} Y{y} F{cfg.feed_slow}
        {% if a == 'okpick' %}
            {% if st.test_x|float %}
                {% set log = st.log|rejectattr('0', 'equalto', st.test_x|float)|list + [[st.test_x|float, 1]] %}
                {% set parts = [] %}
                {% for e in log %}
                    {% set _ = parts.append('[%.3f,%d]' % (e[0], e[1])) %}
                {% endfor %}
                {V}log VALUE=[{parts|join(',')}]
                {V}test_x VALUE=0
            {% endif %}
            G0 X{x} F{cfg.feed_slow}
            G0 Y{safe} F{cfg.feed_fast}
            {V}held VALUE=-2
            {V}pos VALUE=0
        {% else %}
            {V}pos VALUE=1
            {V}x VALUE={x}
            {V}shift VALUE={sh}
            {V}back VALUE=0
            {V}pend VALUE=2
            RESPOND MSG="DOCK_TUNE：已推入，热端吸上了吗？点“退出坞”夹紧并带出"
        {% endif %}

    {% elif a == 'confirm' %}
        {% set v = params.V|default(1)|int %}
        {% if held == -1 and st.test_x|float %}
            {% set log = st.log|rejectattr('0', 'equalto', st.test_x|float)|list + [[st.test_x|float, 1 if v == 0 else 0]] %}
            {% set parts = [] %}
            {% for e in log %}
                {% set _ = parts.append('[%.3f,%d]' % (e[0], e[1])) %}
            {% endfor %}
            {V}log VALUE=[{parts|join(',')}]
            {V}test_x VALUE=0
        {% endif %}
        {V}held VALUE={v}
    {% elif a == 'toggle' %}
        {V}held VALUE={0 if held == 1 else 1}
    {% elif a == 'setcenter' %}
        {% set oks = st.log|selectattr('1')|map(attribute='0')|list %}
        {% if not oks %}
            {action_raise_error("还没有放回成功的记录")}
        {% endif %}
        {% set c = ((oks|min + oks|max) / 2)|round(2) %}
        {% set fails = st.log|rejectattr('1')|map(attribute='0')|list %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_x VALUE={c}
        RESPOND MSG="DOCK_TUNE：进坞 X 设为成功范围中心 {'%.2f' % c}（{'%.2f' % oks|min} ～ {'%.2f' % oks|max}）{'' if (fails|select('lt', oks|min)|list and fails|select('gt', oks|max)|list) else '。注意：还没有两边都测到失败的点，范围可能不完整'}"
    {% elif a == 'clearlog' %}
        {V}log VALUE=[]

    {% elif a == 'cycle' %}
        {% if 'multitool' not in printer %}
            {action_raise_error("没有加载换头插件")}
        {% endif %}
        {% if in_dock or held != 1 %}
            {action_raise_error("热端要在打印头上、打印头在坞外")}
        {% endif %}
        {% set cur = printer.multitool.current_tool|int %}
        {% if cur != tool %}
            {action_raise_error("插件记录的当前工具是 T%d，和打印头上的 T%d 不一致。先 SAVE_VARIABLE VARIABLE=current_tool VALUE=%d 再 RESTART（注意 RESTART 会清掉弹窗里的临时值，先写进文件）" % (cur, tool, tool))}
        {% endif %}
        {% set tools = params.TOOLS.split(',')|map('trim')|map('int')|list if params.TOOLS is defined else [tool] %}
        {% set count = params.COUNT|default(5)|int %}
        {% if count < 1 or count > 100 %}
            {action_raise_error("COUNT 要在 1～100 之间")}
        {% endif %}
        {% if not homed %}
            G28
        {% endif %}
        {% for i in range(count) %}
            RESPOND MSG="DOCK_TUNE 连续取放：第 {i + 1}/{count} 轮"
            {% if tools|length == 1 %}
                UNTOOL
                T{tool}
            {% else %}
                {% for t in tools %}
                    T{t}
                {% endfor %}
            {% endif %}
        {% endfor %}
        {% if tools|length > 1 and tools[-1] != tool %}
            T{tool}
        {% endif %}
        RESPOND MSG="DOCK_TUNE 连续取放完成：{count} 轮，无报错"

    {% elif a == 'result' %}
        RESPOND MSG="DOCK_TUNE 结果：把 changer_cxchanger.cfg 里 variable_t{tool}_dock_x 改成 {'%.2f' % x}，variable_t{tool}_dock_y 改成 {'%.2f' % y}，variable_dock_shift_x 是 {'%.2f' % sh}，variable_dock_dodge_y 是 {'%.2f' % dodge}；改完 RESTART"
    {% elif a == 'close' %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% else %}
        {action_raise_error("未知动作 A=%s" % a)}
    {% endif %}
    {% if a != 'close' %}
        _DOCK_TUNE_SHOW
    {% endif %}

[gcode_macro _DOCK_TUNE_SHOW]
description: 【换头】DOCK_TUNE 的弹窗界面（内部宏）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set st = printer["gcode_macro DOCK_TUNE"] %}
    {% set steps = [1, 0.5, 0.1, 0.01] %}
    {% set tool = st.sel|int %}
    {% set x = cfg['t%d_dock_x' % tool]|float %}
    {% set y = cfg['t%d_dock_y' % tool]|float %}
    {% set sh = cfg.dock_shift_x|float %}
    {% set dodge = cfg.dock_dodge_y|float %}
    {% set in_dock = st.pos|int == 1 %}
    {% set held = st.held|int %}
    {% set log = st.log|sort(attribute='0') %}
    {% set oks = log|selectattr('1')|map(attribute='0')|list %}
    {% set B = 'RESPOND TYPE=command MSG="action:prompt_' %}
    {B}begin 停靠坞调试 T{tool}"
    {B}text 参数：进坞 X {'%.2f' % x}，横移量 {'%.2f' % sh}（横移后 X {'%.2f' % (x + sh)}），后退距离 {'%.2f' % dodge}，推入深度 Y {'%.2f' % y}"
    {% if in_dock %}
    {B}text 当前：在坞里，累计横移 {'%.2f' % st.shift|float}（X {'%.2f' % (st.x|float + st.shift|float)}），累计后退 {'%.2f' % st.back|float}（Y {'%.2f' % (y + st.back|float)}）"
    {% else %}
    {B}text 当前：在坞外，热端{'在打印头上' if held == 1 else ('在坞里' if held == 0 else '位置待确认')}"
    {% endif %}
    {% if st.lo|float or st.hi|float %}
    {B}text 横移记录：耗材松开时 {('%.2f' % st.lo|float) if st.lo|float else '未记录'}，撞击时 {('%.2f' % st.hi|float) if st.hi|float else '未记录'}"
    {% endif %}
    {% if log %}
    {% set marks = [] %}
    {% for e in log %}
        {% set _ = marks.append('%.2f%s' % (e[0], '✓' if e[1] else '✗')) %}
    {% endfor %}
    {B}text 放回记录：{marks|join('  ')}"
    {% endif %}
    {% if oks %}
    {B}text 停靠成功范围 {'%.2f' % oks|min} ～ {'%.2f' % oks|max}，中心 {'%.2f' % ((oks|min + oks|max) / 2)}"
    {% endif %}

    {% if not in_dock and held == -1 %}
    {B}text 热端留在坞里了吗？（挂钩卡在孔里、磁铁吸住）"
    {B}button_group_start"
    {B}button 是，已停靠 → 抓回来|DOCK_TUNE A=okpick|primary"
    {B}button 是，已停靠|DOCK_TUNE A=confirm V=0|secondary"
    {B}button_group_end"
    {B}text 没停靠：X 挪一点，马上再放回一次"
    {B}button_group_start"
    {% for s in [0.5, 0.1, 0.01] %}
    {B}button 否 → X -{s} 再放回|DOCK_TUNE A=retry D=-{s}|warning"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {% for s in [0.01, 0.1, 0.5] %}
    {B}button 否 → X +{s} 再放回|DOCK_TUNE A=retry D={s}|secondary"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {B}button 否，先不调|DOCK_TUNE A=confirm V=1|secondary"
    {B}button_group_end"

    {% elif not in_dock and held == -2 %}
    {B}text 热端带出来了吗？（吸在打印头上、晃一下没有虚位、耗材夹紧）"
    {B}button_group_start"
    {B}button 是 → 再放回测试|DOCK_TUNE A=again|primary"
    {B}button 是，在打印头上|DOCK_TUNE A=confirm V=1|secondary"
    {B}button 否，还在坞里|DOCK_TUNE A=confirm V=0|warning"
    {B}button_group_end"

    {% elif in_dock %}
    {B}text 横移（两个方向都能走，累计 ±6 mm 以内；调到耗材完全松开且不撞）"
    {B}button_group_start"
    {% for s in steps %}
    {B}button 横移 -{s}|DOCK_TUNE A=shift D=-{s}|primary"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {% for s in steps|reverse %}
    {B}button 横移 +{s}|DOCK_TUNE A=shift D={s}|secondary"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {B}button 横移到 {'%.2f' % sh}|DOCK_TUNE A=shiftto|secondary"
    {B}button 记为松开|DOCK_TUNE A=lo|info"
    {B}button 记为撞击|DOCK_TUNE A=hi|warning"
    {B}button 设为横移量|DOCK_TUNE A=setshift|primary"
    {B}button_group_end"
    {B}text 后退 / 推入（+ 往外退看热端是否留在坞里；- 往里推）"
    {B}button_group_start"
    {% for s in steps|reverse %}
    {B}button 后退 +{s}|DOCK_TUNE A=back D={s}|primary"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {% for s in steps %}
    {B}button 后退 -{s}|DOCK_TUNE A=back D=-{s}|secondary"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {B}button 后退到 {'%.2f' % dodge}|DOCK_TUNE A=backto|secondary"
    {B}button 设为后退距离|DOCK_TUNE A=setdodge|primary"
    {B}button 设为推入深度|DOCK_TUNE A=setdepth|primary"
    {B}button 退出坞|DOCK_TUNE A=out|warning"
    {B}button_group_end"

    {% elif held == 1 %}
    {B}text 进坞 X（只改数值，改完点“放回测试”）"
    {B}button_group_start"
    {% for s in steps %}
    {B}button X -{s}|DOCK_TUNE A=entry D=-{s}|secondary"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {% for s in steps|reverse %}
    {B}button X +{s}|DOCK_TUNE A=entry D={s}|secondary"
    {% endfor %}
    {B}button_group_end"
    {B}button_group_start"
    {B}button 进坞|DOCK_TUNE A=go|primary"
    {B}button 放回测试|DOCK_TUNE A=release|primary"
    {% if oks %}
    {B}button 设为进坞中心|DOCK_TUNE A=setcenter|primary"
    {% endif %}
    {B}button_group_end"
    {B}button_group_start"
    {B}button 连续取放 5 轮|DOCK_TUNE A=cycle COUNT=5|info"
    {% if printer.configfile.settings.multitool.tool_count|default(1)|int > 1 %}
    {B}button 全部头混切 5 轮|DOCK_TUNE A=cycle TOOLS={range(printer.configfile.settings.multitool.tool_count|int)|join(',')} COUNT=5|info"
    {% endif %}
    {% if log %}
    {B}button 清空放回记录|DOCK_TUNE A=clearlog|secondary"
    {% endif %}
    {B}button 热端状态不对？切换|DOCK_TUNE A=toggle|secondary"
    {B}button_group_end"

    {% else %}
    {B}button_group_start"
    {B}button 抓取测试|DOCK_TUNE A=pickup|primary"
    {B}button 热端状态不对？切换|DOCK_TUNE A=toggle|secondary"
    {B}button_group_end"
    {% endif %}
    {B}footer_button 显示结果|DOCK_TUNE A=result|info"
    {B}footer_button 关闭|DOCK_TUNE A=close|error"
    {B}show"
