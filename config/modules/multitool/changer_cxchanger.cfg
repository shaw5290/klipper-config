#####################################################################
# 模块：换头方案 CxChanger
#
# 停靠坞参数、放回/抓取动作，以及插件调用的两个钩子宏。
# 更换换头方案时，只替换本模块。
#
# 依赖：multitool/multitool_plugin.cfg
# 提供：multitool_release_tool / multitool_pickup_tool / _release_tool / _pickup_tool / DOCK_TUNE（调试弹窗）
#####################################################################

#####################################################################
# CxChanger 换头路径模板
#
# 方案来源:
#   https://github.com/cx330-TXY/CxChanger
#
# 安装脚本选择 CxChanger 时会复制本文件到：
#   ~/printer_data/config/multitool/change_tool.cfg
#
# 使用前必须按机器实测修改：
#   - 每个工具的 dock_x / dock_y
#   - dock_shift_x / dock_dodge_y / dock_safe_y
#   - feed_safe / feed_fast / feed_slow
#####################################################################


#####################################################################
# 停靠坞参数集中管理
#####################################################################
# CxChanger 方案的所有停靠坞参数集中放在这个宏变量容器中
[gcode_macro _multitool_cfg]
description: 【换头】CxChanger 停靠坞参数（坐标、横移、避让、速度），仅存放变量

# --- 速度 ---
# 调试速度：新调坐标、改 dock 参数后先用这组，看到没对齐来得及点急停
variable_feed_safe:        3000     # 安全区域快速移动速度，单位 mm/min
variable_feed_fast:        600      # 进入/退出停靠坞的常规速度，单位 mm/min
variable_feed_slow:        200      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min
# 正常速度：调试速度下连续换头无撞击后，注释上面三行、取消下面三行注释
#variable_feed_safe:        15000    # 安全区域快速移动速度，单位 mm/min
#variable_feed_fast:        1200     # 进入/退出停靠坞的常规速度，单位 mm/min
#variable_feed_slow:        400      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min

# --- 停靠坞运动逻辑参数 ---
variable_dock_shift_x: -3        # X 方向横移距离，用于开合 CxChanger 摆臂；方向不对时改正负号
variable_dock_dodge_y: 14           # Y 方向避让距离，用于磁吸分离/结合前后的避让位置
variable_dock_safe_y:  30           # 每个 dock 前方安全入口距离，工具头先到这里再进入 dock

# --- 各热端停靠坞坐标：请按机器实测修改 ---
variable_t0_dock_x: 282.78              # 【必改】T0 停靠坞 X 坐标
variable_t0_dock_y: -27.90               # 【必改】T0 停靠坞 Y 坐标
variable_t1_dock_x: 248.30               # 【必改】T1 停靠坞 X 坐标
variable_t1_dock_y: -27.90               # 【必改】T1 停靠坞 Y 坐标
variable_t2_dock_x: 225.00               # 【必改】T2 停靠坞 X 坐标
variable_t2_dock_y: -27.90               # 【必改】T2 停靠坞 Y 坐标
variable_t3_dock_x: 190.10               # 【必改】T3 停靠坞 X 坐标
variable_t3_dock_y: -27.90               # 【必改】T3 停靠坞 Y 坐标
variable_t4_dock_x: 155.10               # 【必改】T4 停靠坞 X 坐标
variable_t4_dock_y: -27.90               # 【必改】T4 停靠坞 Y 坐标
variable_t5_dock_x: 120.60               # 【必改】T5 停靠坞 X 坐标
variable_t5_dock_y: -27.90               # 【必改】T5 停靠坞 Y 坐标
variable_t6_dock_x: 85.20               # 【必改】T6 停靠坞 X 坐标
variable_t6_dock_y: -27.90               # 【必改】T6 停靠坞 Y 坐标
variable_t7_dock_x: 49.90               # 【必改】T7 停靠坞 X 坐标
variable_t7_dock_y: -27.90               # 【必改】T7 停靠坞 Y 坐标
variable_t8_dock_x: 13.70               # 【必改】T8 停靠坞 X 坐标
variable_t8_dock_y: -27.90               # 【必改】T8 停靠坞 Y 坐标

gcode:
    # 仅作变量容器             # 保留空 gcode，避免 Klipper 认为宏无内容


#####################################################################
# 释放热端：将当前热端放回停靠坞
#####################################################################
# CxChanger 放回工具动作，由 multitool_release_tool 转发调用
[gcode_macro _release_tool]
description: 【换头】把热端放回停靠坞的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要放回的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 当前工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 当前工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸分离用 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在放回 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}          # 沿 Y 进入 dock 中心
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # Y 后退完成磁吸分离
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 回位闭合摆臂
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 抓取热端：从停靠坞抓起目标热端
#####################################################################
# CxChanger 抓取工具动作，由 multitool_pickup_tool 转发调用
[gcode_macro _pickup_tool]
description: 【换头】从停靠坞抓取热端的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要抓取的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 目标工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 目标工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸结合前的 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在抓取 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast} # 进入避让位置，准备开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # Y 前进让磁吸工具结合
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}           # X 回位闭合摆臂并锁定工具

    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 带着工具退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 2. 用户钩子：放回热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>，框架已做好 G90 / Z 抬升 / accel 切换 / 入口夹紧自检。
#    在这里写"把 T{tool} 热端放回坞"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_release_tool]
description: 【换头】插件钩子：放回热端，转发到 _release_tool
gcode:
    _release_tool TOOL={params.TOOL}

#####################################################################
# 2. 用户钩子：抓取热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>。
#    在这里写"从坞中抓起 T{tool} 热端"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_pickup_tool]
description: 【换头】插件钩子：抓取热端，转发到 _pickup_tool
gcode:
    _pickup_tool TOOL={params.TOOL}


#####################################################################
# 停靠坞校准：只有一个宏 DOCK_TUNE（打印时不会调用）
#
#   DOCK_TUNE TOOL=0     打开 T0 的校准弹窗，之后只点弹窗里的按钮
#
# 按顺序记录 5 个值（每点一下打印头实际移动一下，像 Z 偏移校准）：
#   ① X 最大：  热端在坞里，X 往 + 走到垫的纸刚好抽不出来的坐标
#   ② Y 最深：  在坞里 Y 往 - 推，垫的纸刚好抽不出来的坐标
#   ③ 进坞补偿：从 X 最大往 X- 退多少，热端居中、顺滑通过坞
#   ④ 停靠 X：  X 左移到热端停进坞、挤出机打开、不卡打印头的坐标
#   ⑤ 撞机 X：  X 继续左移到撞上的坐标
# 由此算出：进坞 X = ① - ③，推入深度 = ②，横移量 = ④ - 进坞 X，安全余量 = ④ - ⑤。
#
# 所有坞的孔径相同：T0 记完 ①～④ 后，其它头只记 ① X 最大，其余按 T0 推算：
#   进坞 X(Tn) = ①(Tn) - ③(T0)，推入深度(Tn) = ②(T0)，横移量所有头共用。
#
# 记录的值用 SAVE_VARIABLE 存进 myvariables.cfg（dock_t0_xmax 等），重启、撞机归位都不会丢；
# 重新记录某一项只覆盖那一项。中途撞了点"撞了"：先归位 Y 再归位 X，沿原路回到撞之前的坐标。
# "应用"只是临时生效，确认后把"显示结果"里的值写进上面的 _multitool_cfg。
#####################################################################
[gcode_macro DOCK_TUNE]
description: 【换头】停靠坞校准弹窗（TOOL=工具号）：按顺序记录 X 最大、Y 最深、进坞补偿、停靠 X、撞机 X
# 运行状态：sel=工具；item=当前第几项（1～5，6=汇总）；pos=1 打印头在校准移动中；
# cx/cy=当前坐标；px/py=上一次移动前的坐标（撞机后回到这里）；ex=最近一次 Y 移动时的 X（回程走这条路）
variable_sel: 0
variable_item: 1
variable_pos: 0
variable_cx: 0.0
variable_cy: 0.0
variable_px: 0.0
variable_py: 0.0
variable_ex: 0.0
variable_msg: ''
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set st = printer["gcode_macro DOCK_TUNE"] %}
    {% set svv = printer.save_variables.variables %}
    {% set a = params.A|default('open')|lower %}
    {% set d = params.D|default(0)|float %}
    {% set tool = (params.TOOL|default(st.sel)|int) if a == 'open' else st.sel|int %}
    {% if ('t%d_dock_x' % tool) not in cfg %}
        {action_raise_error("没有 T%d 的停靠坞参数" % tool)}
    {% endif %}
    {% set x0 = cfg['t%d_dock_x' % tool]|float %}
    {% set y0 = cfg['t%d_dock_y' % tool]|float %}
    {% set safe = (y0 + cfg.dock_safe_y|float)|round(3) %}
    {% set th = printer.toolhead %}
    {% set homed = 'x' in th.homed_axes and 'y' in th.homed_axes %}
    {% set pos = st.pos|int %}
    {% set cx = st.cx|float %}
    {% set cy = st.cy|float %}
    {% set item = st.item|int %}
    {% set pre = 'dock_t%d_' % tool %}
    {% set rec = {} %}
    {% for k in ('xmax', 'ymin', 'comp', 'xdock', 'xcrash') %}
        {% if (pre ~ k) in svv and svv[pre ~ k] is not none %}
            {% set _ = rec.update({k: svv[pre ~ k]|float}) %}
        {% endif %}
    {% endfor %}
    # T0 是基准：记完 ①～④ 后，其它头只记 ①，其余按 T0 推算
    {% set rec0 = {} %}
    {% for k in ('xmax', 'ymin', 'comp', 'xdock', 'xcrash') %}
        {% if ('dock_t0_' ~ k) in svv and svv['dock_t0_' ~ k] is not none %}
            {% set _ = rec0.update({k: svv['dock_t0_' ~ k]|float}) %}
        {% endif %}
    {% endfor %}
    {% set derived = tool != 0 and rec0|length >= 4 and rec0.xmax is defined and rec0.ymin is defined and rec0.comp is defined and rec0.xdock is defined %}
    {% set full = {} %}
    {% if derived %}
        {% if rec.xmax is defined %}
            {% set _ = full.update({'xmax': rec.xmax, 'ymin': rec0.ymin, 'comp': rec0.comp, 'xdock': rec.xmax - (rec0.xmax - rec0.xdock)}) %}
            {% if rec0.xcrash is defined %}
                {% set _ = full.update({'xcrash': rec.xmax - (rec0.xmax - rec0.xcrash)}) %}
            {% endif %}
        {% endif %}
    {% else %}
        {% set _ = full.update(rec) %}
    {% endif %}
    {% set ready = full.xmax is defined and full.ymin is defined and full.comp is defined and full.xdock is defined %}
    {% set V = 'SET_GCODE_VARIABLE MACRO=DOCK_TUNE VARIABLE=' %}
    {V}msg VALUE="''"

    {% if a == 'open' %}
        {% if params.TOOL is defined and pos == 1 and tool != st.sel|int %}
            {action_raise_error("T%d 还在校准移动中，先点“退到坞前”" % st.sel|int)}
        {% endif %}
        {V}sel VALUE={tool}

    {% elif a == 'start' %}
        {% if pos == 1 %}
            {action_raise_error("已经在校准中")}
        {% endif %}
        {% if homed and th.position.y < safe - 0.5 %}
            {action_raise_error("打印头在坞附近（Y=%.2f），先手动退到坞前 Y≥%.2f" % (th.position.y, safe))}
        {% endif %}
        {% if not homed %}
            G28 X Y
        {% endif %}
        {% set near = params.NEAR|default(30)|float %}
        {% if params.SRC|default('cfg') == 'rec' %}
            {% if full.xmax is not defined or full.ymin is not defined %}
                {action_raise_error("还没有记录 ① X 最大和 ② Y 最深")}
            {% endif %}
            {% set sx = (full.xmax - full.comp|default(0))|round(3) %}
            {% set sy = full.ymin %}
        {% else %}
            {% set sx = x0 %}
            {% set sy = y0 %}
        {% endif %}
        {% set ty = [safe, (sy + near)|round(3)]|min %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G90
        G0 X{sx} Y{safe} F{cfg.feed_safe}
        G0 X{sx} Y{ty} F{cfg.feed_fast}
        {V}pos VALUE=1
        {V}cx VALUE={sx}
        {V}cy VALUE={ty}
        {V}px VALUE={sx}
        {V}py VALUE={ty}
        {V}ex VALUE={sx}

    {% elif a == 'jog' %}
        {% if pos != 1 %}
            {action_raise_error("先点“到坞前开始”")}
        {% endif %}
        {% set ax = params.AX|default('X')|upper %}
        {% set nx = (cx + (d if ax == 'X' else 0))|round(3) %}
        {% set ny = (cy + (d if ax == 'Y' else 0))|round(3) %}
        {% if (nx - x0)|abs > 10 %}
            {action_raise_error("X 离配置里的进坞 X 超过 10 mm，停止")}
        {% endif %}
        {% if ny < th.axis_minimum.y|float + 0.5 or ny > safe + 5 %}
            {action_raise_error("Y=%.2f 超出范围（%.2f ～ %.2f）" % (ny, th.axis_minimum.y|float + 0.5, safe + 5))}
        {% endif %}
        G90
        G0 X{nx} Y{ny} F{cfg.feed_slow}
        {V}px VALUE={cx}
        {V}py VALUE={cy}
        {V}cx VALUE={nx}
        {V}cy VALUE={ny}
        {% if ax == 'Y' %}
            {V}ex VALUE={cx}
        {% endif %}
        RESPOND MSG="DOCK_TUNE T{tool}：X {'%.2f' % nx}  Y {'%.2f' % ny}{('（补偿 %.2f）' % (full.xmax - nx)) if item == 3 and full.xmax is defined else ''}"

    {% elif a == 'crash' %}
        {% if pos != 1 %}
            {action_raise_error("不在校准移动中")}
        {% endif %}
        {% if item == 5 %}
            SAVE_VARIABLE VARIABLE={pre}xcrash VALUE={cx}
            {V}msg VALUE="'已记录 ⑤ 撞机 X = {'%.2f' % cx}'"
        {% endif %}
        G28 Y
        G28 X
        G90
        G0 X{st.ex|float} Y{safe} F{cfg.feed_safe}
        G0 X{st.ex|float} Y{st.py|float} F{cfg.feed_slow}
        G0 X{st.px|float} Y{st.py|float} F{cfg.feed_slow}
        {V}cx VALUE={st.px|float}
        {V}cy VALUE={st.py|float}
        {% if item == 5 %}
            {V}item VALUE=6
        {% endif %}

    {% elif a == 'rec' %}
        {% if pos != 1 %}
            {action_raise_error("先点“到坞前开始”")}
        {% endif %}
        {% if item == 1 %}
            SAVE_VARIABLE VARIABLE={pre}xmax VALUE={cx}
            {V}msg VALUE="'已记录 ① X 最大 = {'%.2f' % cx}{'，其余按 T0 推算' if derived else ''}'"
        {% elif item == 2 %}
            SAVE_VARIABLE VARIABLE={pre}ymin VALUE={cy}
            {V}msg VALUE="'已记录 ② Y 最深 = {'%.2f' % cy}'"
        {% elif item == 3 %}
            {% if 'xmax' not in rec %}
                {action_raise_error("先记录 ① X 最大")}
            {% endif %}
            {% set comp = (rec.xmax - cx)|round(3) %}
            SAVE_VARIABLE VARIABLE={pre}comp VALUE={comp}
            {V}msg VALUE="'已记录 ③ 进坞补偿 = {'%.2f' % comp}（进坞 X {'%.2f' % cx}）'"
        {% elif item == 4 %}
            SAVE_VARIABLE VARIABLE={pre}xdock VALUE={cx}
            {V}msg VALUE="'已记录 ④ 停靠 X = {'%.2f' % cx}'"
        {% elif item == 5 %}
            SAVE_VARIABLE VARIABLE={pre}xcrash VALUE={cx}
            {V}msg VALUE="'已记录 ⑤ 撞机 X = {'%.2f' % cx}'"
        {% endif %}
        {V}item VALUE={6 if derived else [item + 1, 6]|min}

    {% elif a == 'goto' %}
        {V}item VALUE={params.V|int}

    {% elif a == 'out' %}
        {% if pos != 1 %}
            {action_raise_error("不在校准移动中")}
        {% endif %}
        G90
        G0 X{st.ex|float} F{cfg.feed_slow}
        G0 Y{safe} F{cfg.feed_fast}
        {V}pos VALUE=0

    {% elif a == 'apply' %}
        {% if not ready %}
            {action_raise_error("还没记录完（T0 要记 ①～④，其它头要记 ①）")}
        {% endif %}
        {% set dx = (full.xmax - full.comp)|round(2) %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_x VALUE={dx}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_y VALUE={full.ymin|round(2)}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_shift_x VALUE={(full.xdock - dx)|round(2)}
        {V}msg VALUE="'已临时应用，RESTART 前把“显示结果”里的值写进文件'"

    {% elif a == 'clear' %}
        {% for k in ('xmax', 'ymin', 'comp', 'xdock', 'xcrash') %}
            {% if (pre ~ k) in svv %}
                SAVE_VARIABLE VARIABLE={pre}{k} VALUE=None
            {% endif %}
        {% endfor %}
        {V}item VALUE=1

    {% elif a == 'result' %}
        {% if not ready %}
            {action_raise_error("还没记录完（T0 要记 ①～④，其它头要记 ①）")}
        {% endif %}
        {% set dx = (full.xmax - full.comp)|round(2) %}
        RESPOND MSG="DOCK_TUNE T{tool} 结果：variable_t{tool}_dock_x: {'%.2f' % dx}，variable_t{tool}_dock_y: {'%.2f' % full.ymin}，variable_dock_shift_x: {'%.2f' % (full.xdock - dx)}（所有头共用）。写进 changer_cxchanger.cfg 的 _multitool_cfg 后 RESTART"

    {% elif a == 'close' %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% else %}
        {action_raise_error("未知动作 A=%s" % a)}
    {% endif %}
    {% if a not in ('close', 'jog') %}
        _DOCK_TUNE_SHOW
    {% endif %}

[gcode_macro _DOCK_TUNE_SHOW]
description: 【换头】DOCK_TUNE 的弹窗界面（内部宏）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set st = printer["gcode_macro DOCK_TUNE"] %}
    {% set svv = printer.save_variables.variables %}
    {% set tool = st.sel|int %}
    {% set item = st.item|int %}
    {% set pos = st.pos|int %}
    {% set cx = st.cx|float %}
    {% set cy = st.cy|float %}
    {% set pre = 'dock_t%d_' % tool %}
    {% set rec = {} %}
    {% for k in ('xmax', 'ymin', 'comp', 'xdock', 'xcrash') %}
        {% if (pre ~ k) in svv and svv[pre ~ k] is not none %}
            {% set _ = rec.update({k: svv[pre ~ k]|float}) %}
        {% endif %}
    {% endfor %}
    # T0 是基准：记完 ①～④ 后，其它头只记 ①，其余按 T0 推算
    {% set rec0 = {} %}
    {% for k in ('xmax', 'ymin', 'comp', 'xdock', 'xcrash') %}
        {% if ('dock_t0_' ~ k) in svv and svv['dock_t0_' ~ k] is not none %}
            {% set _ = rec0.update({k: svv['dock_t0_' ~ k]|float}) %}
        {% endif %}
    {% endfor %}
    {% set derived = tool != 0 and rec0|length >= 4 and rec0.xmax is defined and rec0.ymin is defined and rec0.comp is defined and rec0.xdock is defined %}
    {% set full = {} %}
    {% if derived %}
        {% if rec.xmax is defined %}
            {% set _ = full.update({'xmax': rec.xmax, 'ymin': rec0.ymin, 'comp': rec0.comp, 'xdock': rec.xmax - (rec0.xmax - rec0.xdock)}) %}
            {% if rec0.xcrash is defined %}
                {% set _ = full.update({'xcrash': rec.xmax - (rec0.xmax - rec0.xcrash)}) %}
            {% endif %}
        {% endif %}
    {% else %}
        {% set _ = full.update(rec) %}
    {% endif %}
    {% set ready = full.xmax is defined and full.ymin is defined and full.comp is defined and full.xdock is defined %}
    {% set names = {1: '① X 最大', 2: '② Y 最深', 3: '③ 进坞补偿', 4: '④ 停靠 X', 5: '⑤ 撞机 X', 6: '汇总'} %}
    {% set tips = {1: '推进坞（Y-），再 X+ 走到垫的纸刚好抽不出来，记录',
                   2: '在坞里 Y- 推，垫的纸刚好抽不出来，记录',
                   3: '从 X 最大往 X- 退，热端居中、顺滑通过坞，记录',
                   4: 'X- 左移，热端停进坞、挤出机打开、不卡打印头，记录',
                   5: '继续 X- 左移到撞上，点“撞了”会自动记录撞机 X'} %}
    {% set B = 'RESPOND TYPE=command MSG="action:prompt_' %}
    {% macro v(k, fmt='%.2f') -%}{(fmt % rec[k]) if k in rec else '未记录'}{%- endmacro %}
    {% macro row(items) -%}
    {B}button_group_start"
    {% for it in items %}
    {B}button {it[0]}|DOCK_TUNE {it[1]}|{it[2]}"
    {% endfor %}
    {B}button_group_end"
    {%- endmacro %}

    {B}begin T{tool} 停靠校准：{names[item]}{('（只需记录 ①，其余按 T0）' if derived else ' ' ~ item ~ '/5') if item <= 5 else ''}"
    {% if derived %}
    {B}text 已记录：① X最大 {v('xmax')}｜其余按 T0 推算（T0：① {'%.2f' % rec0.xmax}，② {'%.2f' % rec0.ymin}，③ {'%.2f' % rec0.comp}，④ {'%.2f' % rec0.xdock}）"
    {% else %}
    {B}text 已记录：① X最大 {v('xmax')}｜② Y最深 {v('ymin')}｜③ 进坞补偿 {v('comp')}｜④ 停靠X {v('xdock')}｜⑤ 撞机X {v('xcrash')}"
    {% endif %}
    {% if st.msg %}
    {B}text ▶ {st.msg}"
    {% endif %}

    {% if item <= 5 %}
    {B}text {tips[item]}"
        {% if pos != 1 %}
        {% if full.xmax is defined and full.ymin is defined %}
    {B}text 开始：已有记录，可以直接靠近已记录的位置（X {'%.2f' % (full.xmax - full.comp|default(0))}  Y {'%.2f' % full.ymin}）"
    {row([['靠近已记录位置（前 3 mm）', 'A=start SRC=rec NEAR=3', 'primary'], ['到坞前开始（30 mm 外）', 'A=start NEAR=30', 'secondary']])}
        {% else %}
    {B}text 开始：第一次只有大概位置（配置里 X {'%.2f' % cfg['t%d_dock_x' % tool]|float}  Y {'%.2f' % cfg['t%d_dock_y' % tool]|float}），先停在坞前 30 mm，用 Y -10 / -5 快速靠近，再用小步距推进去"
    {row([['到坞前开始（30 mm 外）', 'A=start NEAR=30', 'primary'], ['靠近配置位置（前 10 mm）', 'A=start NEAR=10', 'secondary']])}
        {% endif %}
        {% else %}
    {B}text 微调按钮不刷新弹窗，当前坐标看控制台（每点一次输出一行）；记录时用最后的坐标"
    {% set r = [] %}{% for s in [1, 0.5, 0.1, 0.01] %}{% set _ = r.append(['X -%s' % s, 'A=jog AX=X D=-%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {% set r = [] %}{% for s in [0.01, 0.1, 0.5, 1] %}{% set _ = r.append(['X +%s' % s, 'A=jog AX=X D=%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {% set r = [] %}{% for s in [10, 5, 1, 0.5, 0.1, 0.01] %}{% set _ = r.append(['Y -%s' % s, 'A=jog AX=Y D=-%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {% set r = [] %}{% for s in [0.01, 0.1, 0.5, 1, 5, 10] %}{% set _ = r.append(['Y +%s' % s, 'A=jog AX=Y D=%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {% set first = [['记录' ~ names[item][1:] ~ ('，完成' if derived else '，下一项'), 'A=rec', 'primary']] if item < 5 else [['记录当前为撞机 X', 'A=rec', 'primary']] %}
    {row(first + [['撞了 → 归位并回到撞前位置' if item < 5 else '撞了 → 记录撞机 X 并归位', 'A=crash', 'error']])}
        {% endif %}
    {% set nav = [] %}
    {% if item > 1 %}{% set _ = nav.append(['上一项', 'A=goto V=%d' % (item - 1), 'secondary']) %}{% endif %}
    {% set _ = nav.append(['跳过，下一项', 'A=goto V=%d' % (6 if derived else item + 1), 'secondary']) %}
    {% if pos == 1 %}{% set _ = nav.append(['退到坞前', 'A=out', 'warning']) %}{% endif %}
    {row(nav)}

    {% else %}
        {% if ready %}
    {% set dx = full.xmax - full.comp %}
            {% if derived %}
    {B}text 按 T0 推算：进坞 X = ①(T{tool}) - ③(T0) = {'%.2f' % dx}｜推入深度 = ②(T0) = {'%.2f' % full.ymin}｜横移量（共用）= {'%.2f' % (full.xdock - dx)}"
            {% else %}
    {B}text 进坞 X = ① - ③ = {'%.2f' % dx}｜推入深度 = ② = {'%.2f' % full.ymin}｜横移量 = ④ - 进坞 X = {'%.2f' % (full.xdock - dx)}"
            {% endif %}
            {% if full.xcrash is defined %}
    {B}text 安全余量 = ④ - ⑤ = {'%.2f' % (full.xdock - full.xcrash)}（横移量在这个范围内不会撞）"
            {% endif %}
    {B}text 现在配置里：进坞 X {'%.2f' % cfg['t%d_dock_x' % tool]|float}｜推入深度 {'%.2f' % cfg['t%d_dock_y' % tool]|float}｜横移量 {'%.2f' % cfg.dock_shift_x|float}"
    {row([['应用（临时生效）', 'A=apply', 'primary'], ['显示要写进文件的值', 'A=result', 'info']])}
        {% else %}
    {B}text 还没记录完：{'回到 ① 记录 X 最大' if derived else '①～④ 都要记录'}"
        {% endif %}
    {% set nav = [['上一项', 'A=goto V=%d' % (1 if derived else 5), 'secondary'], ['从 ① 重新看', 'A=goto V=1', 'secondary'], ['清除 T%d 全部记录' % tool, 'A=clear', 'warning']] %}
    {% if pos == 1 %}{% set _ = nav.append(['退到坞前', 'A=out', 'warning']) %}{% endif %}
    {row(nav)}
    {% endif %}
    {B}footer_button 关闭|DOCK_TUNE A=close|error"
    {B}show"
