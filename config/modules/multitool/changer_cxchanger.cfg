#####################################################################
# 模块：换头方案 CxChanger
#
# 停靠坞参数、放回/抓取动作，以及插件调用的两个钩子宏。
# 更换换头方案时，只替换本模块。
#
# 依赖：multitool/multitool_plugin.cfg
# 提供：multitool_release_tool / multitool_pickup_tool / _release_tool / _pickup_tool / DOCK_TUNE（调试弹窗）
#####################################################################

#####################################################################
# CxChanger 换头路径模板
#
# 方案来源:
#   https://github.com/cx330-TXY/CxChanger
#
# 安装脚本选择 CxChanger 时会复制本文件到：
#   ~/printer_data/config/multitool/change_tool.cfg
#
# 使用前必须按机器实测修改：
#   - 每个工具的 dock_x / dock_y
#   - dock_shift_x / dock_dodge_y / dock_safe_y
#   - feed_safe / feed_fast / feed_slow
#####################################################################


#####################################################################
# 停靠坞参数集中管理
#####################################################################
# CxChanger 方案的所有停靠坞参数集中放在这个宏变量容器中
[gcode_macro _multitool_cfg]
description: 【换头】CxChanger 停靠坞参数（坐标、横移、避让、速度），仅存放变量

# --- 速度 ---
# 调试速度：新调坐标、改 dock 参数后先用这组，看到没对齐来得及点急停
variable_feed_safe:        3000     # 安全区域快速移动速度，单位 mm/min
variable_feed_fast:        600      # 进入/退出停靠坞的常规速度，单位 mm/min
variable_feed_slow:        200      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min
# 正常速度：调试速度下连续换头无撞击后，注释上面三行、取消下面三行注释
#variable_feed_safe:        15000    # 安全区域快速移动速度，单位 mm/min
#variable_feed_fast:        1200     # 进入/退出停靠坞的常规速度，单位 mm/min
#variable_feed_slow:        400      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min

# --- 停靠坞运动逻辑参数 ---
variable_dock_shift_x: -3        # X 方向横移距离，用于开合 CxChanger 摆臂；方向不对时改正负号
variable_dock_dodge_y: 14           # Y 方向避让距离，用于磁吸分离/结合前后的避让位置
variable_dock_safe_y:  30           # 每个 dock 前方安全入口距离，工具头先到这里再进入 dock

# --- 各热端停靠坞坐标：请按机器实测修改 ---
variable_t0_dock_x: 282.78              # 【必改】T0 停靠坞 X 坐标
variable_t0_dock_y: -27.90               # 【必改】T0 停靠坞 Y 坐标
variable_t1_dock_x: 248.30               # 【必改】T1 停靠坞 X 坐标
variable_t1_dock_y: -27.90               # 【必改】T1 停靠坞 Y 坐标
variable_t2_dock_x: 225.00               # 【必改】T2 停靠坞 X 坐标
variable_t2_dock_y: -27.90               # 【必改】T2 停靠坞 Y 坐标
variable_t3_dock_x: 190.10               # 【必改】T3 停靠坞 X 坐标
variable_t3_dock_y: -27.90               # 【必改】T3 停靠坞 Y 坐标
variable_t4_dock_x: 155.10               # 【必改】T4 停靠坞 X 坐标
variable_t4_dock_y: -27.90               # 【必改】T4 停靠坞 Y 坐标
variable_t5_dock_x: 120.60               # 【必改】T5 停靠坞 X 坐标
variable_t5_dock_y: -27.90               # 【必改】T5 停靠坞 Y 坐标
variable_t6_dock_x: 85.20               # 【必改】T6 停靠坞 X 坐标
variable_t6_dock_y: -27.90               # 【必改】T6 停靠坞 Y 坐标
variable_t7_dock_x: 49.90               # 【必改】T7 停靠坞 X 坐标
variable_t7_dock_y: -27.90               # 【必改】T7 停靠坞 Y 坐标
variable_t8_dock_x: 13.70               # 【必改】T8 停靠坞 X 坐标
variable_t8_dock_y: -27.90               # 【必改】T8 停靠坞 Y 坐标

gcode:
    # 仅作变量容器             # 保留空 gcode，避免 Klipper 认为宏无内容


#####################################################################
# 释放热端：将当前热端放回停靠坞
#####################################################################
# CxChanger 放回工具动作，由 multitool_release_tool 转发调用
[gcode_macro _release_tool]
description: 【换头】把热端放回停靠坞的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要放回的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 当前工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 当前工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸分离用 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在放回 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}          # 沿 Y 进入 dock 中心
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # Y 后退完成磁吸分离
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 回位闭合摆臂
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 抓取热端：从停靠坞抓起目标热端
#####################################################################
# CxChanger 抓取工具动作，由 multitool_pickup_tool 转发调用
[gcode_macro _pickup_tool]
description: 【换头】从停靠坞抓取热端的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要抓取的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 目标工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 目标工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸结合前的 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在抓取 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast} # 进入避让位置，准备开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # Y 前进让磁吸工具结合
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}           # X 回位闭合摆臂并锁定工具

    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 带着工具退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 2. 用户钩子：放回热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>，框架已做好 G90 / Z 抬升 / accel 切换 / 入口夹紧自检。
#    在这里写"把 T{tool} 热端放回坞"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_release_tool]
description: 【换头】插件钩子：放回热端，转发到 _release_tool
gcode:
    _release_tool TOOL={params.TOOL}

#####################################################################
# 2. 用户钩子：抓取热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>。
#    在这里写"从坞中抓起 T{tool} 热端"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_pickup_tool]
description: 【换头】插件钩子：抓取热端，转发到 _pickup_tool
gcode:
    _pickup_tool TOOL={params.TOOL}


#####################################################################
# 停靠坞调试：只有一个宏 DOCK_TUNE（打印时不会调用）
#
#   DOCK_TUNE TOOL=0     打开 T0 的调试弹窗，之后只点弹窗里的按钮
#
# 弹窗用 Klipper 的 action:prompt 协议（Mainsail 2.9 及以上、较新版本的 Fluidd），
# 按钮都是调用 DOCK_TUNE A=<动作>。分 4 步：
#   1 进坞点：  打印头到坞前，X / Y 两个方向 ± 微调推进坞，挂钩刚好卡进孔时"保存为进坞点"
#   2 停靠偏移：调横移量（X 方向）和后退距离（Y 方向），"放回测试"后确认停靠成功 / 没停靠 / 有撞击；
#              有撞击时先归位 Y 再归位 X，然后改偏移或回第 1 步改进坞点
#   3 取放确认：完整取放 1 次或 3 次，由人确认后标记这个头 ✓ 已确认 / ✗ 异常（存在 myvariables.cfg）
#   4 重复测试：已确认的头单头重复取放，以及所有头之间的有序组合切换（用换头插件 T0/T1/UNTOOL）
#
# 弹窗里改的进坞点、横移量、后退距离都是临时的（RESTART 后恢复成文件里的值），
# 调好后点"显示结果"，把值写进上面的 _multitool_cfg。
#####################################################################
[gcode_macro DOCK_TUNE]
description: 【换头】停靠坞调试弹窗（TOOL=工具号）：1 进坞点 → 2 停靠偏移 → 3 取放确认 → 4 重复测试
# 状态：sel=调试的工具；step=当前步骤；pos=0 坞外 / 1 第 1 步微调中 / 2 第 2 步横移后停住；
# cx/cy=第 1 步当前位置；px=第 2 步停住时的累计横移；
# held=热端位置：1 打印头上，0 坞里，-1 放回后待确认，-2 抓取后待确认，-3 取放后待确认，-4 归位后待确认，-5 重复测试后待确认
variable_sel: 0
variable_step: 1
variable_pos: 0
variable_cx: 0.0
variable_cy: 0.0
variable_px: 0.0
variable_held: 1
variable_msg: ''
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set st = printer["gcode_macro DOCK_TUNE"] %}
    {% set a = params.A|default('open')|lower %}
    {% set d = params.D|default(0)|float %}
    {% set tool = (params.TOOL|default(st.sel)|int) if a == 'open' else st.sel|int %}
    {% if ('t%d_dock_x' % tool) not in cfg %}
        {action_raise_error("没有 T%d 的停靠坞参数" % tool)}
    {% endif %}
    {% set n = printer.configfile.settings.multitool.tool_count|default(1)|int %}
    {% set x = cfg['t%d_dock_x' % tool]|float %}
    {% set y = cfg['t%d_dock_y' % tool]|float %}
    {% set sh = cfg.dock_shift_x|float %}
    {% set dodge = cfg.dock_dodge_y|float %}
    {% set safe = (y + cfg.dock_safe_y|float)|round(3) %}
    {% set fs = cfg.feed_safe %}
    {% set ff = cfg.feed_fast %}
    {% set fl = cfg.feed_slow %}
    {% set th = printer.toolhead %}
    {% set homed = 'x' in th.homed_axes and 'y' in th.homed_axes %}
    {% set pos = st.pos|int %}
    {% set held = st.held|int %}
    {% set V = 'SET_GCODE_VARIABLE MACRO=DOCK_TUNE VARIABLE=' %}

    {% macro release() -%}
    G0 X{x} Y{safe} F{fs}
    G0 X{x} Y{y} F{fl}
    G0 X{(x + sh)|round(3)} F{fl}
    G0 Y{(y + dodge)|round(3)} F{fl}
    G0 X{x} F{fl}
    G0 Y{safe} F{ff}
    {%- endmacro %}
    {% macro pickup() -%}
    G0 X{x} Y{safe} F{fs}
    G0 X{x} Y{(y + dodge)|round(3)} F{ff}
    G0 X{(x + sh)|round(3)} Y{(y + dodge)|round(3)} F{fl}
    G0 X{(x + sh)|round(3)} Y{y} F{fl}
    G0 X{x} F{fl}
    G0 Y{safe} F{ff}
    {%- endmacro %}
    {% macro mark(t, v) -%}
    SAVE_VARIABLE VARIABLE=dock_mark_t{t} VALUE={v}
    {%- endmacro %}

    # ---------- 通用检查 ----------
    {% set moves = ('s1front', 's1saved', 'peek', 'release', 'pickup', 's3') %}
    {% if a in moves %}
        {% if pos != 0 %}
            {action_raise_error("打印头还在坞里，先退到坞前")}
        {% endif %}
        {% if homed and th.position.y < safe - 0.5 %}
            {action_raise_error("打印头在坞附近（Y=%.2f），先手动退到坞前 Y≥%.2f" % (th.position.y, safe))}
        {% endif %}
        {% if a == 'pickup' and held != 0 %}
            {action_raise_error("热端不在坞里，不需要抓取")}
        {% endif %}
        {% if a != 'pickup' and held != 1 %}
            {action_raise_error("热端要在打印头上。先把待确认的问题回答了，或者把热端拿回来")}
        {% endif %}
        {% if not homed %}
            G28 X Y
        {% endif %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G90
    {% endif %}
    {% if a in ('step', 'tool', 'adj') and (pos != 0 or held < 0) %}
        {action_raise_error("先退出坞、回答完待确认的问题")}
    {% endif %}
    {V}msg VALUE="''"

    # ---------- 通用动作 ----------
    {% if a == 'open' %}
        {% if params.TOOL is defined %}
            {% if pos != 0 %}
                {action_raise_error("打印头还在坞里，先退到坞前")}
            {% endif %}
            {V}sel VALUE={tool}
            {V}held VALUE=1
        {% endif %}
    {% elif a == 'step' %}
        {V}step VALUE={params.V|int}
    {% elif a == 'tool' %}
        {% if held != 1 %}
            {action_raise_error("换调试的头之前，热端要在打印头上")}
        {% endif %}
        {V}sel VALUE={params.V|int}
        {V}msg VALUE="'请确认打印头上装的是 T{params.V|int}；不是的话手动换上'"
    {% elif a == 'crash' %}
        G28 Y
        G28 X
        {V}pos VALUE=0
        {V}held VALUE=-4
        {% if st.step|int == 3 %}
            {mark(tool, 2)}
        {% endif %}
    {% elif a == 'loc' %}
        {V}held VALUE={params.V|int}

    # ---------- 第 1 步：进坞点 ----------
    {% elif a == 's1front' %}
        G0 X{x} Y{safe} F{fs}
        {V}pos VALUE=1
        {V}cx VALUE={x}
        {V}cy VALUE={safe}
    {% elif a == 's1saved' %}
        G0 X{x} Y{safe} F{fs}
        G0 X{x} Y{y} F{fl}
        {V}pos VALUE=1
        {V}cx VALUE={x}
        {V}cy VALUE={y}
    {% elif a == 'jog' %}
        {% if pos != 1 %}
            {action_raise_error("先点“到坞前”")}
        {% endif %}
        {% set ax = params.AX|default('X')|upper %}
        {% set nx = (st.cx|float + (d if ax == 'X' else 0))|round(3) %}
        {% set ny = (st.cy|float + (d if ax == 'Y' else 0))|round(3) %}
        {% if (nx - x)|abs > 10 %}
            {action_raise_error("X 离已保存的进坞点超过 10 mm，停止")}
        {% endif %}
        {% if ny < th.axis_minimum.y|float + 0.5 or ny > safe + 5 %}
            {action_raise_error("Y=%.2f 超出范围（%.2f ～ %.2f）" % (ny, th.axis_minimum.y|float + 0.5, safe + 5))}
        {% endif %}
        G90
        G0 X{nx} Y{ny} F{fl}
        {V}cx VALUE={nx}
        {V}cy VALUE={ny}
    {% elif a == 's1save' %}
        {% if pos != 1 %}
            {action_raise_error("先进坞微调到挂钩卡进孔")}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_x VALUE={st.cx|float}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_y VALUE={st.cy|float}
        {V}msg VALUE="'T{tool} 进坞点已保存：X={'%.2f' % st.cx|float} Y={'%.2f' % st.cy|float}'"
    {% elif a == 's1out' %}
        G90
        G0 Y{(st.cy|float if st.cy|float > safe else safe)} F{fl}
        {V}pos VALUE=0

    # ---------- 第 2 步：停靠偏移 ----------
    {% elif a == 'adj' %}
        {% set k = params.K|default('shift')|lower %}
        {% if k == 'shift' %}
            {% set nv = (sh + d)|round(3) %}
            {% if nv|abs > 6 %}
                {action_raise_error("横移量超过 ±6 mm")}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_shift_x VALUE={nv}
        {% else %}
            {% set nv = (dodge + d)|round(3) %}
            {% if nv < 2 or nv > cfg.dock_safe_y|float %}
                {action_raise_error("后退距离要在 2 ～ %.1f 之间" % cfg.dock_safe_y|float)}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_dodge_y VALUE={nv}
        {% endif %}
    {% elif a == 'peek' %}
        G0 X{x} Y{safe} F{fs}
        G0 X{x} Y{y} F{fl}
        G0 X{(x + sh)|round(3)} F{fl}
        {V}pos VALUE=2
        {V}px VALUE={sh}
    {% elif a == 'pjog' %}
        {% if pos != 2 %}
            {action_raise_error("先点“进坞并横移后停住”")}
        {% endif %}
        {% set nv = (st.px|float + d)|round(3) %}
        {% if nv|abs > 6 %}
            {action_raise_error("横移超过 ±6 mm")}
        {% endif %}
        G90
        G0 X{(x + nv)|round(3)} F{fl}
        {V}px VALUE={nv}
    {% elif a == 'pset' %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_shift_x VALUE={st.px|float}
        {V}msg VALUE="'横移量已改为 {'%.2f' % st.px|float}'"
    {% elif a == 'pout' %}
        {% if pos != 2 %}
            {action_raise_error("不在横移停住状态")}
        {% endif %}
        G90
        G0 X{x} F{fl}
        G0 Y{safe} F{ff}
        {V}pos VALUE=0
    {% elif a == 'release' %}
        {release()}
        {V}held VALUE=-1
    {% elif a == 'pickup' %}
        {pickup()}
        {V}held VALUE=-2
    {% elif a in ('okdock', 'nodock', 'okpick', 'nopick') %}
        {V}held VALUE={0 if a in ('okdock', 'nopick') else 1}

    # ---------- 第 3 步：取放确认 ----------
    {% elif a == 's3' %}
        {% for i in range(params.N|default(1)|int) %}
            RESPOND MSG="DOCK_TUNE：T{tool} 取放第 {i + 1} 次"
            {release()}
            {pickup()}
        {% endfor %}
        {V}held VALUE=-3
    {% elif a == 's3ok' %}
        {mark(tool, 1)}
        {V}held VALUE=1
        {V}msg VALUE="'T{tool} 已标记为 ✓ 已确认'"
    {% elif a == 's3bad' %}
        {mark(tool, 2)}
        {V}held VALUE=1
        {V}msg VALUE="'T{tool} 已标记为 ✗ 异常，回第 1 / 2 步调整'"
    {% elif a == 'unmark' %}
        {mark(tool, 0)}

    # ---------- 第 4 步：重复测试 ----------
    {% elif a in ('s4single', 's4cross') %}
        {% set svv = printer.save_variables.variables %}
        {% set ok = [] %}
        {% for t in range(n) %}
            {% if svv['dock_mark_t%d' % t]|default(0)|int == 1 %}
                {% set _ = ok.append(t) %}
            {% endif %}
        {% endfor %}
        {% if 'multitool' not in printer or printer.multitool.current_tool|int != tool or held != 1 or pos != 0 %}
            {action_raise_error("要求：打印头在坞外、装着 T%d，换头插件记录的当前工具也是 T%d（现在是 T%d）" % (tool, tool, printer.multitool.current_tool|int if 'multitool' in printer else -1))}
        {% endif %}
        {% if tool not in ok %}
            {action_raise_error("T%d 还没在第 3 步确认" % tool)}
        {% endif %}
        {% set rounds = params.N|default(1)|int %}
        {% if not homed %}
            G28
        {% endif %}
        {% if a == 's4single' %}
            {% for r in range(rounds) %}
                {% for t in ok %}
                    RESPOND MSG="DOCK_TUNE 单头重复：第 {r + 1}/{rounds} 轮 T{t}"
                    T{t}
                    UNTOOL
                {% endfor %}
            {% endfor %}
        {% else %}
            {% if ok|length < 2 %}
                {action_raise_error("至少要有 2 个已确认的头才能测切换")}
            {% endif %}
            {% for r in range(rounds) %}
                {% for i in ok %}
                    {% for j in ok if j != i %}
                        RESPOND MSG="DOCK_TUNE 多头切换：第 {r + 1}/{rounds} 轮 T{i} → T{j}"
                        T{i}
                        T{j}
                    {% endfor %}
                {% endfor %}
            {% endfor %}
        {% endif %}
        T{tool}
        {V}held VALUE=-5
    {% elif a == 's4ok' %}
        {V}held VALUE=1
        {V}msg VALUE="'重复测试通过'"
    {% elif a == 's4bad' %}
        {mark(params.T|int, 2)}
        {V}msg VALUE="'T{params.T|int} 已标记为 ✗ 异常'"

    # ---------- 其它 ----------
    {% elif a == 'result' %}
        RESPOND MSG="DOCK_TUNE 结果：changer_cxchanger.cfg 的 _multitool_cfg 里 variable_t{tool}_dock_x: {'%.2f' % x}，variable_t{tool}_dock_y: {'%.2f' % y}，variable_dock_shift_x: {'%.2f' % sh}，variable_dock_dodge_y: {'%.2f' % dodge}；改完 RESTART"
    {% elif a == 'close' %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% else %}
        {action_raise_error("未知动作 A=%s" % a)}
    {% endif %}
    {% if a != 'close' %}
        _DOCK_TUNE_SHOW
    {% endif %}

[gcode_macro _DOCK_TUNE_SHOW]
description: 【换头】DOCK_TUNE 的弹窗界面（内部宏）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set st = printer["gcode_macro DOCK_TUNE"] %}
    {% set svv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set n = printer.configfile.settings.multitool.tool_count|default(1)|int %}
    {% set tool = st.sel|int %}
    {% set step = st.step|int %}
    {% set pos = st.pos|int %}
    {% set held = st.held|int %}
    {% set x = cfg['t%d_dock_x' % tool]|float %}
    {% set y = cfg['t%d_dock_y' % tool]|float %}
    {% set sh = cfg.dock_shift_x|float %}
    {% set dodge = cfg.dock_dodge_y|float %}
    {% set B = 'RESPOND TYPE=command MSG="action:prompt_' %}
    {% set marks = [] %}
    {% set ok = [] %}
    {% for t in range(n) %}
        {% set m = svv['dock_mark_t%d' % t]|default(0)|int %}
        {% set _ = marks.append('T%d %s' % (t, '✓已确认' if m == 1 else ('✗异常' if m == 2 else '未确认'))) %}
        {% if m == 1 %}{% set _ = ok.append(t) %}{% endif %}
    {% endfor %}
    {% macro row(items) -%}
    {B}button_group_start"
    {% for it in items %}
    {B}button {it[0]}|DOCK_TUNE {it[1]}|{it[2]}"
    {% endfor %}
    {B}button_group_end"
    {%- endmacro %}

    {B}begin 停靠坞调试 T{tool}（第 {step} 步）"
    {B}text 进坞点 X {'%.2f' % x}  Y {'%.2f' % y}｜横移量 {'%.2f' % sh}｜后退距离 {'%.2f' % dodge}"
    {B}text 标记：{marks|join('   ')}"
    {% if st.msg %}
    {B}text ▶ {st.msg}"
    {% endif %}

    {% if held < 0 %}
        {% if held == -1 %}
    {B}text 放回结果？（热端应该挂在坞里，打印头空着出来）"
    {row([['停靠成功，无撞击', 'A=okdock', 'primary'], ['没停靠，热端还在打印头上', 'A=nodock', 'warning'], ['有撞击 → 归位', 'A=crash', 'error']])}
        {% elif held == -2 %}
    {B}text 抓取结果？（热端应该吸在打印头上，耗材夹紧）"
    {row([['带出来了，无撞击', 'A=okpick', 'primary'], ['没带出来，还在坞里', 'A=nopick', 'warning'], ['有撞击 → 归位', 'A=crash', 'error']])}
        {% elif held == -3 %}
    {B}text 取放过程正确吗？（每次都停靠成功、带出成功，没有撞击）"
    {row([['全部正确 → 标记 T' ~ tool ~ ' 已确认', 'A=s3ok', 'primary'], ['有问题 → 标记 T' ~ tool ~ ' 异常', 'A=s3bad', 'warning'], ['有撞击 → 归位', 'A=crash', 'error']])}
        {% elif held == -4 %}
    {B}text 已归位（先 Y 后 X）。热端现在在哪？"
    {row([['在打印头上', 'A=loc V=1', 'primary'], ['在坞里', 'A=loc V=0', 'secondary']])}
        {% elif held == -5 %}
    {B}text 重复测试过程正常吗？哪个头有问题就标记它"
    {% set items = [['全程正常', 'A=s4ok', 'primary']] %}
    {% for t in ok %}
        {% set _ = items.append(['T%d 有问题 → 标记异常' % t, 'A=s4bad T=%d' % t, 'warning']) %}
    {% endfor %}
    {% set _ = items.append(['有撞击 → 归位', 'A=crash', 'error']) %}
    {row(items)}
        {% endif %}

    {% else %}
    {% set nav = [] %}
    {% for i, name in [(1, '1 进坞点'), (2, '2 停靠偏移'), (3, '3 取放确认'), (4, '4 重复测试')] %}
        {% set _ = nav.append([name, 'A=step V=%d' % i, 'primary' if i == step else 'secondary']) %}
    {% endfor %}
    {% if pos == 0 %}
    {row(nav)}
        {% if held == 1 and n > 1 %}
    {% set sel = [] %}
    {% for t in range(n) %}
        {% set _ = sel.append(['调 T%d' % t, 'A=tool V=%d' % t, 'primary' if t == tool else 'secondary']) %}
    {% endfor %}
    {row(sel)}
        {% endif %}
    {% endif %}
    {B}text 热端：{'在打印头上' if held == 1 else '在坞里'}"

        {% if step == 1 %}
            {% if pos == 0 %}
    {B}text 第 1 步：打印头到坞前，X / Y 微调推进坞，挂钩刚好卡进孔时保存"
    {row([['到坞前', 'A=s1front', 'primary'], ['直接到已保存的进坞点', 'A=s1saved', 'secondary']])}
            {% else %}
    {B}text 当前 X {'%.2f' % st.cx|float}  Y {'%.2f' % st.cy|float}（和已保存的差 ΔX {'%+.2f' % (st.cx|float - x)}  ΔY {'%+.2f' % (st.cy|float - y)}）"
    {% set r = [] %}{% for s in [1, 0.5, 0.1, 0.01] %}{% set _ = r.append(['X -%s' % s, 'A=jog AX=X D=-%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {% set r = [] %}{% for s in [0.01, 0.1, 0.5, 1] %}{% set _ = r.append(['X +%s' % s, 'A=jog AX=X D=%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {% set r = [] %}{% for s in [1, 0.5, 0.1, 0.01] %}{% set _ = r.append(['Y -%s（往里）' % s, 'A=jog AX=Y D=-%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {% set r = [] %}{% for s in [0.01, 0.1, 0.5, 1] %}{% set _ = r.append(['Y +%s（往外）' % s, 'A=jog AX=Y D=%s' % s, 'secondary']) %}{% endfor %}
    {row(r)}
    {row([['保存为进坞点 X=%.2f Y=%.2f' % (st.cx|float, st.cy|float), 'A=s1save', 'primary'], ['直线退到坞前', 'A=s1out', 'warning'], ['有撞击 → 归位', 'A=crash', 'error']])}
            {% endif %}

        {% elif step == 2 %}
            {% if pos == 2 %}
    {B}text 已进坞并横移 {'%.2f' % st.px|float}（X {'%.2f' % (x + st.px|float)}）：拉一下耗材，看有没有撞"
    {row([['横移 -0.1', 'A=pjog D=-0.1', 'secondary'], ['横移 -0.01', 'A=pjog D=-0.01', 'secondary'], ['横移 +0.01', 'A=pjog D=0.01', 'secondary'], ['横移 +0.1', 'A=pjog D=0.1', 'secondary']])}
    {row([['横移量改为 %.2f' % st.px|float, 'A=pset', 'primary'], ['退出（不放回）', 'A=pout', 'warning'], ['有撞击 → 归位', 'A=crash', 'error']])}
            {% elif held == 1 %}
    {B}text 第 2 步：调横移量（X）和后退距离（Y），再放回测试"
    {row([['横移量 -0.5', 'A=adj K=shift D=-0.5', 'secondary'], ['横移量 -0.1', 'A=adj K=shift D=-0.1', 'secondary'], ['横移量 -0.01', 'A=adj K=shift D=-0.01', 'secondary'], ['横移量 +0.01', 'A=adj K=shift D=0.01', 'secondary'], ['横移量 +0.1', 'A=adj K=shift D=0.1', 'secondary'], ['横移量 +0.5', 'A=adj K=shift D=0.5', 'secondary']])}
    {row([['后退距离 -1', 'A=adj K=dodge D=-1', 'secondary'], ['后退距离 -0.5', 'A=adj K=dodge D=-0.5', 'secondary'], ['后退距离 +0.5', 'A=adj K=dodge D=0.5', 'secondary'], ['后退距离 +1', 'A=adj K=dodge D=1', 'secondary']])}
    {row([['进坞并横移后停住（看耗材）', 'A=peek', 'secondary'], ['放回测试', 'A=release', 'primary']])}
            {% else %}
    {B}text 热端在坞里，抓回来再继续"
    {row([['抓回来', 'A=pickup', 'primary']])}
            {% endif %}

        {% elif step == 3 %}
            {% if held == 1 %}
    {B}text 第 3 步：完整取放（放回 + 抓取），看完确认并标记 T{tool}"
    {row([['取放 1 次', 'A=s3 N=1', 'primary'], ['取放 3 次', 'A=s3 N=3', 'primary'], ['清除 T%d 标记' % tool, 'A=unmark', 'secondary']])}
            {% else %}
    {B}text 热端在坞里，抓回来再继续"
    {row([['抓回来', 'A=pickup', 'primary']])}
            {% endif %}

        {% elif step == 4 %}
    {B}text 第 4 步：用换头插件测，只测已确认的头：{('T' ~ ok|join('、T')) if ok else '无'}"
            {% set cur = printer.multitool.current_tool|int if 'multitool' in printer else -1 %}
            {% if held != 1 or cur != tool %}
    {B}text 要求：热端 T{tool} 在打印头上，且换头插件记录的当前工具也是 T{tool}（现在插件记录 T{cur}）"
            {% else %}
    {row([['单头重复 1 轮', 'A=s4single N=1', 'primary'], ['单头重复 3 轮', 'A=s4single N=3', 'primary']])}
                {% if ok|length > 1 %}
    {B}text 多头切换：已确认头之间的所有有序组合，每轮 {ok|length * (ok|length - 1)} 次切换"
    {row([['多头切换 1 轮', 'A=s4cross N=1', 'primary'], ['多头切换 3 轮', 'A=s4cross N=3', 'primary']])}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    {B}footer_button 显示结果|DOCK_TUNE A=result|info"
    {B}footer_button 关闭|DOCK_TUNE A=close|error"
    {B}show"
