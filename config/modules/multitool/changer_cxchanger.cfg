#####################################################################
# 模块：换头方案 CxChanger
#
# 停靠坞参数、放回/抓取动作，以及插件调用的两个钩子宏。
# 更换换头方案时，只替换本模块。
#
# 依赖：multitool/multitool_plugin.cfg
# 提供：multitool_release_tool / multitool_pickup_tool / _release_tool / _pickup_tool / DOCK_ 调试宏
#####################################################################

#####################################################################
# CxChanger 换头路径模板
#
# 方案来源:
#   https://github.com/cx330-TXY/CxChanger
#
# 安装脚本选择 CxChanger 时会复制本文件到：
#   ~/printer_data/config/multitool/change_tool.cfg
#
# 使用前必须按机器实测修改：
#   - 每个工具的 dock_x / dock_y
#   - dock_shift_x / dock_dodge_y / dock_safe_y
#   - feed_safe / feed_fast / feed_slow
#####################################################################


#####################################################################
# 停靠坞参数集中管理
#####################################################################
# CxChanger 方案的所有停靠坞参数集中放在这个宏变量容器中
[gcode_macro _multitool_cfg]
description: 【换头】CxChanger 停靠坞参数（坐标、横移、避让、速度），仅存放变量

# --- 速度 ---
# 调试速度：新调坐标、改 dock 参数后先用这组，看到没对齐来得及点急停
variable_feed_safe:        3000     # 安全区域快速移动速度，单位 mm/min
variable_feed_fast:        600      # 进入/退出停靠坞的常规速度，单位 mm/min
variable_feed_slow:        200      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min
# 正常速度：调试速度下连续换头无撞击后，注释上面三行、取消下面三行注释
#variable_feed_safe:        15000    # 安全区域快速移动速度，单位 mm/min
#variable_feed_fast:        1200     # 进入/退出停靠坞的常规速度，单位 mm/min
#variable_feed_slow:        400      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min

# --- 停靠坞运动逻辑参数 ---
variable_dock_shift_x: -3        # X 方向横移距离，用于开合 CxChanger 摆臂；方向不对时改正负号
variable_dock_dodge_y: 14           # Y 方向避让距离，用于磁吸分离/结合前后的避让位置
variable_dock_safe_y:  30           # 每个 dock 前方安全入口距离，工具头先到这里再进入 dock

# --- 各热端停靠坞坐标：请按机器实测修改 ---
variable_t0_dock_x: 282.78              # 【必改】T0 停靠坞 X 坐标
variable_t0_dock_y: -27.90               # 【必改】T0 停靠坞 Y 坐标
variable_t1_dock_x: 248.30               # 【必改】T1 停靠坞 X 坐标
variable_t1_dock_y: -27.90               # 【必改】T1 停靠坞 Y 坐标
variable_t2_dock_x: 225.00               # 【必改】T2 停靠坞 X 坐标
variable_t2_dock_y: -27.90               # 【必改】T2 停靠坞 Y 坐标
variable_t3_dock_x: 190.10               # 【必改】T3 停靠坞 X 坐标
variable_t3_dock_y: -27.90               # 【必改】T3 停靠坞 Y 坐标
variable_t4_dock_x: 155.10               # 【必改】T4 停靠坞 X 坐标
variable_t4_dock_y: -27.90               # 【必改】T4 停靠坞 Y 坐标
variable_t5_dock_x: 120.60               # 【必改】T5 停靠坞 X 坐标
variable_t5_dock_y: -27.90               # 【必改】T5 停靠坞 Y 坐标
variable_t6_dock_x: 85.20               # 【必改】T6 停靠坞 X 坐标
variable_t6_dock_y: -27.90               # 【必改】T6 停靠坞 Y 坐标
variable_t7_dock_x: 49.90               # 【必改】T7 停靠坞 X 坐标
variable_t7_dock_y: -27.90               # 【必改】T7 停靠坞 Y 坐标
variable_t8_dock_x: 13.70               # 【必改】T8 停靠坞 X 坐标
variable_t8_dock_y: -27.90               # 【必改】T8 停靠坞 Y 坐标

gcode:
    # 仅作变量容器             # 保留空 gcode，避免 Klipper 认为宏无内容


#####################################################################
# 释放热端：将当前热端放回停靠坞
#####################################################################
# CxChanger 放回工具动作，由 multitool_release_tool 转发调用
[gcode_macro _release_tool]
description: 【换头】把热端放回停靠坞的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要放回的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 当前工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 当前工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸分离用 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在放回 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}          # 沿 Y 进入 dock 中心
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # Y 后退完成磁吸分离
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 回位闭合摆臂
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 抓取热端：从停靠坞抓起目标热端
#####################################################################
# CxChanger 抓取工具动作，由 multitool_pickup_tool 转发调用
[gcode_macro _pickup_tool]
description: 【换头】从停靠坞抓取热端的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要抓取的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 目标工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 目标工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸结合前的 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在抓取 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast} # 进入避让位置，准备开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # Y 前进让磁吸工具结合
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}           # X 回位闭合摆臂并锁定工具

    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 带着工具退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 2. 用户钩子：放回热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>，框架已做好 G90 / Z 抬升 / accel 切换 / 入口夹紧自检。
#    在这里写"把 T{tool} 热端放回坞"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_release_tool]
description: 【换头】插件钩子：放回热端，转发到 _release_tool
gcode:
    _release_tool TOOL={params.TOOL}

#####################################################################
# 2. 用户钩子：抓取热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>。
#    在这里写"从坞中抓起 T{tool} 热端"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_pickup_tool]
description: 【换头】插件钩子：抓取热端，转发到 _pickup_tool
gcode:
    _pickup_tool TOOL={params.TOOL}


#####################################################################
# 停靠坞调试宏（手动调坞用，打印时不会调用）
#
# 坐标都从上面的 _multitool_cfg 读取并自动计算，全部用绝对坐标（不用 G91），
# 每条命令只走一小步，走完在控制台显示当前位置。
#
#   DOCK_SHOW                    列出各坞当前参数和横移后 X
#   DOCK_GO TOOL=0 [DX=0.25]     推进 T0 的坞并停在里面；DX 是在 dock_x 上临时加的偏移，用来扫 X
#   DOCK_SHIFT [D=-0.25]         在坞里再横移一步（累计，默认每次 -0.25；累计超过 |dock_shift_x|+0.5 会拒绝）
#   DOCK_SHIFT TO=-3             直接横移到累计 -3
#   DOCK_BACK [D=2]              往外后退一步（累计，默认每次 2 mm），测磁吸分离
#   DOCK_PICKUP TOOL=0           按当前参数做抓取，停在"推入、磁吸结合"这一步
#   DOCK_OUT                     X 回到进坞位置（摆臂闭合），再退到坞前安全入口
#   DOCK_SET TOOL=0 X=283.65     临时修改参数，立即生效、不用重启；也可 SHIFT= / DODGE=
#   DOCK_TUNE TOOL=0             打开调试弹窗，用按钮完成上面所有操作（Mainsail 2.9+ / 新版 Fluidd）
#                                RESTART 后恢复成文件里的值，确认好要写进上面的 _multitool_cfg
#
# 打印头上装的热端要和 TOOL 一致；DOCK_GO 开始前会清掉对刀偏移，没归位时先 G28 X Y。
# 这些宏不经过换头插件，插件记录的当前工具不会变：用 DOCK_BACK 把热端放进坞以后，
# 要用 DOCK_PICKUP + DOCK_OUT 再拿回来，保持"打印头上有热端"，和插件记录一致。
#####################################################################
[gcode_macro _DOCK_DBG]
description: 【换头】停靠坞调试状态（当前工具、进坞 X、累计横移、累计后退、弹窗选中的工具、松开点/撞击点），仅存放变量
variable_tool: -1
variable_x: 0.0
variable_shift: 0.0
variable_back: 0.0
variable_sel: 0
variable_lo_x: 0.0
variable_hi_x: 0.0
gcode:

[gcode_macro DOCK_SHOW]
description: 【换头】调试：列出各坞当前参数（进坞 X、横移后 X、Y、横移、后退）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set n = printer.configfile.settings.multitool.tool_count|default(2)|int %}
    {% set lines = ["横移 dock_shift_x = %.2f，后退 dock_dodge_y = %.2f，安全入口 dock_safe_y = %.2f" % (cfg.dock_shift_x|float, cfg.dock_dodge_y|float, cfg.dock_safe_y|float)] %}
    {% for t in range(n) %}
        {% set x = cfg['t%d_dock_x' % t]|float %}
        {% set _ = lines.append("T%d：进坞 X = %.2f，横移后 X = %.2f，dock_y = %.2f" % (t, x, x + cfg.dock_shift_x|float, cfg['t%d_dock_y' % t]|float)) %}
    {% endfor %}
    {action_respond_info(lines|join('\n'))}

[gcode_macro DOCK_GO]
description: 【换头】调试：推进第 N 个坞并停在里面（TOOL=工具号；DX=在 dock_x 上临时加的偏移，用来扫 X）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set dx = params.DX|default(0)|float %}
    {% if ('t%d_dock_x' % tool) not in cfg %}
        {action_raise_error("没有 T%d 的停靠坞参数" % tool)}
    {% endif %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% if s.tool|int >= 0 %}
        {action_raise_error("还停在 T%d 的坞里，先执行 DOCK_OUT" % s.tool|int)}
    {% endif %}
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and printer.toolhead.position.y < cfg.dock_safe_y|float + cfg['t%d_dock_y' % tool]|float - 0.5 %}
        {action_raise_error("打印头在坞附近（Y=%.2f），先手动退到坞前安全入口 Y≥%.2f" % (printer.toolhead.position.y, cfg.dock_safe_y|float + cfg['t%d_dock_y' % tool]|float))}
    {% endif %}
    {% if dx|abs > 2 %}
        {action_raise_error("DX=%.2f 太大，扫 X 每次在 ±2 mm 以内" % dx)}
    {% endif %}
    {% set x = (cfg['t%d_dock_x' % tool]|float + dx)|round(3) %}
    {% set y = cfg['t%d_dock_y' % tool]|float|round(3) %}
    {% set safe = (y + cfg.dock_safe_y|float)|round(3) %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G90
    G0 X{x} Y{safe} F{cfg.feed_safe}
    G0 X{x} Y{y} F{cfg.feed_slow}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=tool VALUE={tool}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=x VALUE={x}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=shift VALUE=0
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=back VALUE=0
    RESPOND MSG="DOCK_GO：已推进 T{tool} 的坞，X={'%.2f' % x}（dock_x {'%+.2f' % dx}），Y={'%.2f' % y}。看完 DOCK_OUT 退出"

[gcode_macro DOCK_SHIFT]
description: 【换头】调试：在坞里横移一步（D=每步距离，默认 -0.25；TO=直接到累计值；LIMIT=累计上限，默认 |dock_shift_x|+0.5）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% if s.tool|int < 0 %}
        {action_raise_error("先执行 DOCK_GO 推进坞")}
    {% endif %}
    {% set limit = params.LIMIT|default(cfg.dock_shift_x|float|abs + 0.5)|float %}
    {% if params.TO is defined %}
        {% set new = params.TO|float|round(3) %}
    {% else %}
        {% set new = (s.shift|float + params.D|default(-0.25)|float)|round(3) %}
    {% endif %}
    {% if new|abs > limit %}
        {action_raise_error("累计横移 %.2f 超过上限 %.2f，停止。确实要走，加 LIMIT=" % (new, limit))}
    {% endif %}
    {% if new * cfg.dock_shift_x|float < 0 %}
        {action_raise_error("累计横移 %.2f 和 dock_shift_x（%.2f）方向相反，会顶到坞的另一侧，停止" % (new, cfg.dock_shift_x|float))}
    {% endif %}
    G90
    G0 X{(s.x|float + new)|round(3)} F{cfg.feed_slow}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=shift VALUE={new}
    RESPOND MSG="DOCK_SHIFT：累计横移 {'%.2f' % new}，X={'%.2f' % (s.x|float + new)}。拉一下耗材，听有没有撞击声"

[gcode_macro DOCK_BACK]
description: 【换头】调试：往外后退一步测磁吸分离（D=每步距离，默认 2；TO=直接到累计值）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% if s.tool|int < 0 %}
        {action_raise_error("先执行 DOCK_GO 推进坞")}
    {% endif %}
    {% set y0 = cfg['t%d_dock_y' % s.tool|int]|float %}
    {% if params.TO is defined %}
        {% set new = params.TO|float|round(3) %}
    {% else %}
        {% set new = (s.back|float + params.D|default(2)|float)|round(3) %}
    {% endif %}
    {% if new < 0 or new > cfg.dock_safe_y|float %}
        {action_raise_error("累计后退 %.2f 超出 0～%.2f" % (new, cfg.dock_safe_y|float))}
    {% endif %}
    G90
    G0 Y{(y0 + new)|round(3)} F{cfg.feed_slow}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=back VALUE={new}
    RESPOND MSG="DOCK_BACK：累计后退 {'%.2f' % new}，Y={'%.2f' % (y0 + new)}。热端分开了吗"

[gcode_macro DOCK_PICKUP]
description: 【换头】调试：按当前参数做抓取，停在"推入、磁吸结合"这一步（TOOL=工具号）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set tool = params.TOOL|default(0)|int %}
    {% if ('t%d_dock_x' % tool) not in cfg %}
        {action_raise_error("没有 T%d 的停靠坞参数" % tool)}
    {% endif %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% if s.tool|int >= 0 %}
        {action_raise_error("还停在 T%d 的坞里，先执行 DOCK_OUT" % s.tool|int)}
    {% endif %}
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and printer.toolhead.position.y < cfg.dock_safe_y|float + cfg['t%d_dock_y' % tool]|float - 0.5 %}
        {action_raise_error("打印头在坞附近（Y=%.2f），先手动退到坞前安全入口 Y≥%.2f" % (printer.toolhead.position.y, cfg.dock_safe_y|float + cfg['t%d_dock_y' % tool]|float))}
    {% endif %}
    {% set x = cfg['t%d_dock_x' % tool]|float|round(3) %}
    {% set y = cfg['t%d_dock_y' % tool]|float|round(3) %}
    {% set sx = (x + cfg.dock_shift_x|float)|round(3) %}
    {% set ys = (y + cfg.dock_safe_y|float)|round(3) %}
    {% set yd = (y + cfg.dock_dodge_y|float)|round(3) %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G90
    G0 X{x} Y{ys} F{cfg.feed_safe}
    G0 X{x} Y{yd} F{cfg.feed_fast}
    G0 X{sx} Y{yd} F{cfg.feed_slow}
    G0 X{sx} Y{y} F{cfg.feed_slow}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=tool VALUE={tool}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=x VALUE={x}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=shift VALUE={cfg.dock_shift_x|float}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=back VALUE=0
    RESPOND MSG="DOCK_PICKUP：T{tool} 已推入，X={'%.2f' % sx}。热端吸上了吗？看完 DOCK_OUT 夹紧并带出"

[gcode_macro DOCK_OUT]
description: 【换头】调试：X 回到进坞位置（摆臂闭合），再退到坞前安全入口
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% if s.tool|int < 0 %}
        {action_raise_error("当前不在调试状态（没有执行 DOCK_GO / DOCK_PICKUP）")}
    {% endif %}
    {% set safe = (cfg['t%d_dock_y' % s.tool|int]|float + cfg.dock_safe_y|float)|round(3) %}
    G90
    G0 X{s.x} F{cfg.feed_slow}
    G0 Y{safe} F{cfg.feed_fast}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=tool VALUE=-1
    RESPOND MSG="DOCK_OUT：已退出到 X={'%.2f' % s.x|float} Y={'%.2f' % safe}"

[gcode_macro DOCK_SET]
description: 【换头】调试：临时修改坞参数，立即生效不用重启（TOOL= X= / SHIFT= / DODGE=）；RESTART 后恢复文件里的值
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set msgs = [] %}
    {% if params.X is defined %}
        {% set tool = params.TOOL|default(0)|int %}
        {% if ('t%d_dock_x' % tool) not in cfg %}
            {action_raise_error("没有 T%d 的停靠坞参数" % tool)}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{tool}_dock_x VALUE={params.X|float}
        {% set _ = msgs.append("t%d_dock_x = %.2f" % (tool, params.X|float)) %}
    {% endif %}
    {% if params.SHIFT is defined %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_shift_x VALUE={params.SHIFT|float}
        {% set _ = msgs.append("dock_shift_x = %.2f" % params.SHIFT|float) %}
    {% endif %}
    {% if params.DODGE is defined %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_dodge_y VALUE={params.DODGE|float}
        {% set _ = msgs.append("dock_dodge_y = %.2f" % params.DODGE|float) %}
    {% endif %}
    {% if not msgs %}
        {action_raise_error("用法：DOCK_SET TOOL=0 X=283.65，或 SHIFT=-3，或 DODGE=14")}
    {% endif %}
    RESPOND MSG="DOCK_SET：已临时修改 {msgs|join('，')}。RESTART 后恢复，确认好写进 changer_cxchanger.cfg 的 _multitool_cfg"


#####################################################################
# 停靠坞调试弹窗
#
#   DOCK_TUNE TOOL=0     打开 T0 的调试弹窗；之后按按钮操作，每按一次弹窗刷新
#
# 弹窗用 Klipper 的 action:prompt 协议，Mainsail 2.9 及以上、较新版本的 Fluidd 支持。
# 弹窗里改的进坞 X 是临时值（同 DOCK_SET），点"显示结果"把要写进文件的值打印到控制台。
# 横移按钮的累计上限是 6 mm，用来找撞击点；听到撞击声马上点"记为撞击点"再"退出坞"。
#####################################################################
[gcode_macro DOCK_TUNE]
description: 【换头】调试：打开停靠坞调试弹窗（TOOL=工具号），用按钮调进坞 X、横移、后退、抓取
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% set tool = params.TOOL|default(s.sel)|int %}
    {% if ('t%d_dock_x' % tool) not in cfg %}
        {action_raise_error("没有 T%d 的停靠坞参数" % tool)}
    {% endif %}
    {% if s.tool|int >= 0 and s.tool|int != tool %}
        {action_raise_error("还停在 T%d 的坞里，先执行 DOCK_OUT" % s.tool|int)}
    {% endif %}
    {% if tool != s.sel|int %}
        SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=lo_x VALUE=0
        SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=hi_x VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=sel VALUE={tool}
    _DOCK_TUNE_SHOW

[gcode_macro _DOCK_TUNE_SHOW]
description: 【换头】调试弹窗：按当前状态画出弹窗（内部宏）
variable_steps: [1, 0.5, 0.1, 0.01]
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% set steps = printer["gcode_macro _DOCK_TUNE_SHOW"].steps %}
    {% set tool = s.sel|int %}
    {% set x = cfg['t%d_dock_x' % tool]|float %}
    {% set sh = cfg.dock_shift_x|float %}
    {% set in_dock = s.tool|int >= 0 %}
    {% set lo = s.lo_x|float %}
    {% set hi = s.hi_x|float %}
    RESPOND TYPE=command MSG="action:prompt_begin 停靠坞调试 T{tool}"
    RESPOND TYPE=command MSG="action:prompt_text 进坞 X {'%.2f' % x}，横移量 {'%.2f' % sh}（横移后 X {'%.2f' % (x + sh)}），后退 {'%.2f' % cfg.dock_dodge_y|float}"
    {% if in_dock %}
    RESPOND TYPE=command MSG="action:prompt_text 当前：在坞里，累计横移 {'%.2f' % s.shift|float}（X {'%.2f' % (s.x|float + s.shift|float)}），累计后退 {'%.2f' % s.back|float}"
    {% else %}
    RESPOND TYPE=command MSG="action:prompt_text 当前：在坞外"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text 松开点 X：{('%.2f' % lo) if lo else '未记录'}，撞击点 X：{('%.2f' % hi) if hi else '未记录'}"

    # 进坞 X：减一排、加一排（在坞里点会先退出再重新推进）
    RESPOND TYPE=command MSG="action:prompt_text 进坞 X（重新推进）"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for st in steps %}
    RESPOND TYPE=command MSG="action:prompt_button X -{st}|_DOCK_TUNE_DO A=entry D=-{st}|secondary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for st in steps|reverse %}
    RESPOND TYPE=command MSG="action:prompt_button X +{st}|_DOCK_TUNE_DO A=entry D={st}|secondary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"

    {% if in_dock %}
    # 横移：减一排、加一排
    RESPOND TYPE=command MSG="action:prompt_text 横移（在坞里）"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for st in steps %}
    RESPOND TYPE=command MSG="action:prompt_button 横移 -{st}|_DOCK_TUNE_DO A=shift D=-{st}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for st in steps|reverse %}
    RESPOND TYPE=command MSG="action:prompt_button 横移 +{st}|_DOCK_TUNE_DO A=shift D={st}|secondary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 横移到 {'%.2f' % sh}|_DOCK_TUNE_DO A=shiftto|secondary"
    RESPOND TYPE=command MSG="action:prompt_button 记为松开点|_DOCK_TUNE_DO A=lo|info"
    RESPOND TYPE=command MSG="action:prompt_button 记为撞击点|_DOCK_TUNE_DO A=hi|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"

    # 后退：加一排（往外）、减一排（往回推）
    RESPOND TYPE=command MSG="action:prompt_text 后退（磁吸分离）"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for st in steps|reverse %}
    RESPOND TYPE=command MSG="action:prompt_button 后退 +{st}|_DOCK_TUNE_DO A=back D={st}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for st in steps %}
    RESPOND TYPE=command MSG="action:prompt_button 后退 -{st}|_DOCK_TUNE_DO A=back D=-{st}|secondary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 后退到 {'%.2f' % cfg.dock_dodge_y|float}|_DOCK_TUNE_DO A=backto|secondary"
    RESPOND TYPE=command MSG="action:prompt_button 退出坞|_DOCK_TUNE_DO A=out|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% else %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 进坞|_DOCK_TUNE_DO A=go|primary"
    RESPOND TYPE=command MSG="action:prompt_button 抓取测试|_DOCK_TUNE_DO A=pickup|primary"
    {% if lo and hi %}
    RESPOND TYPE=command MSG="action:prompt_button 按中点更新进坞 X|_DOCK_TUNE_DO A=mid|info"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button 显示结果|_DOCK_TUNE_DO A=result|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button 关闭|_DOCK_TUNE_DO A=close|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DOCK_TUNE_DO]
description: 【换头】调试弹窗：执行按钮动作后刷新弹窗（内部宏）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set s = printer["gcode_macro _DOCK_DBG"] %}
    {% set tool = s.sel|int %}
    {% set a = params.A|default('')|lower %}
    {% set d = params.D|default(0)|float %}
    {% set x = cfg['t%d_dock_x' % tool]|float %}
    {% set in_dock = s.tool|int >= 0 %}
    {% set cur = (s.x|float + s.shift|float)|round(3) %}
    {% if a == 'go' %}
        DOCK_GO TOOL={tool}
    {% elif a == 'entry' %}
        {% if in_dock %}
            DOCK_OUT
        {% endif %}
        DOCK_SET TOOL={tool} X={(x + d)|round(3)}
        DOCK_GO TOOL={tool}
    {% elif a == 'shift' %}
        DOCK_SHIFT D={d} LIMIT=6
    {% elif a == 'shiftto' %}
        DOCK_SHIFT TO={cfg.dock_shift_x|float} LIMIT=6
    {% elif a == 'lo' %}
        SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=lo_x VALUE={cur}
        RESPOND MSG="DOCK_TUNE：松开点 X = {'%.2f' % cur}（累计横移 {'%.2f' % s.shift|float}）"
    {% elif a == 'hi' %}
        SET_GCODE_VARIABLE MACRO=_DOCK_DBG VARIABLE=hi_x VALUE={cur}
        RESPOND MSG="DOCK_TUNE：撞击点 X = {'%.2f' % cur}（累计横移 {'%.2f' % s.shift|float}）"
    {% elif a == 'mid' %}
        {% if not (s.lo_x|float and s.hi_x|float) %}
            {action_raise_error("先记录松开点和撞击点")}
        {% endif %}
        {% set mid = ((s.lo_x|float + s.hi_x|float) / 2)|round(3) %}
        {% set nx = (mid - cfg.dock_shift_x|float)|round(2) %}
        DOCK_SET TOOL={tool} X={nx}
        RESPOND MSG="DOCK_TUNE：横移后中点 X = {'%.2f' % mid}，进坞 X 更新为 {'%.2f' % nx}（= 中点 - 横移量 {'%.2f' % cfg.dock_shift_x|float}）"
    {% elif a == 'back' %}
        DOCK_BACK D={d}
    {% elif a == 'backto' %}
        DOCK_BACK TO={cfg.dock_dodge_y|float}
    {% elif a == 'pickup' %}
        DOCK_PICKUP TOOL={tool}
    {% elif a == 'out' %}
        DOCK_OUT
    {% elif a == 'result' %}
        RESPOND MSG="DOCK_TUNE 结果：把 changer_cxchanger.cfg 里 variable_t{tool}_dock_x 改成 {'%.2f' % x}，variable_dock_shift_x 是 {'%.2f' % cfg.dock_shift_x|float}，variable_dock_dodge_y 是 {'%.2f' % cfg.dock_dodge_y|float}；改完 RESTART"
    {% elif a == 'close' %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% else %}
        {action_raise_error("未知动作 A=%s" % a)}
    {% endif %}
    {% if a != 'close' %}
        _DOCK_TUNE_SHOW
    {% endif %}
