#####################################################################
# 模块：换头方案 CxChanger
#
# 停靠坞参数、放回/抓取动作，以及插件调用的两个钩子宏。
# 更换换头方案时，只替换本模块。
#
# 依赖：multitool/multitool_plugin.cfg
# 提供：multitool_release_tool / multitool_pickup_tool / _release_tool / _pickup_tool / DOCK_MOVE / DOCK_SAVE / DOCK_POINTS / DOCK_TEST
#####################################################################

#####################################################################
# CxChanger 换头路径模板
#
# 方案来源:
#   https://github.com/cx330-TXY/CxChanger
#
# 安装脚本选择 CxChanger 时会复制本文件到：
#   ~/printer_data/config/multitool/change_tool.cfg
#
# 使用前必须按机器实测修改：
#   - 每个工具的 dock_x / dock_y
#   - dock_shift_x / dock_dodge_y / dock_safe_y
#   - feed_safe / feed_fast / feed_slow
#####################################################################


#####################################################################
# 停靠坞参数集中管理
#####################################################################
# CxChanger 方案的所有停靠坞参数集中放在这个宏变量容器中
[gcode_macro _multitool_cfg]
description: 【换头】CxChanger 停靠坞参数（坐标、横移、避让、速度），仅存放变量

# --- 速度 ---
# 调试速度：新调坐标、改 dock 参数后先用这组，看到没对齐来得及点急停
variable_feed_safe:        3000     # 安全区域快速移动速度，单位 mm/min
variable_feed_fast:        600      # 进入/退出停靠坞的常规速度，单位 mm/min
variable_feed_slow:        200      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min
# 正常速度：调试速度下连续换头无撞击后，注释上面三行、取消下面三行注释
#variable_feed_safe:        15000    # 安全区域快速移动速度，单位 mm/min
#variable_feed_fast:        1200     # 进入/退出停靠坞的常规速度，单位 mm/min
#variable_feed_slow:        400      # 开合摆臂、磁吸结合/分离的低速动作速度，单位 mm/min

# --- 停靠坞运动逻辑参数 ---
variable_dock_shift_x: -3.9        # X 方向横移距离，用于开合 CxChanger 摆臂；方向不对时改正负号
variable_dock_dodge_y: 14           # Y 方向避让距离，用于磁吸分离/结合前后的避让位置
variable_dock_safe_y:  30           # 每个 dock 前方安全入口距离，工具头先到这里再进入 dock

# --- 各热端停靠坞坐标：请按机器实测修改 ---
variable_t0_dock_x: 283.11              # 【必改】T0 停靠坞 X 坐标
variable_t0_dock_y: -28.07               # 【必改】T0 停靠坞 Y 坐标
variable_t1_dock_x: 247.90               # 【必改】T1 停靠坞 X 坐标
variable_t1_dock_y: -28.07               # 【必改】T1 停靠坞 Y 坐标
variable_t2_dock_x: 225.00               # 【必改】T2 停靠坞 X 坐标
variable_t2_dock_y: -27.90               # 【必改】T2 停靠坞 Y 坐标
variable_t3_dock_x: 190.10               # 【必改】T3 停靠坞 X 坐标
variable_t3_dock_y: -27.90               # 【必改】T3 停靠坞 Y 坐标
variable_t4_dock_x: 155.10               # 【必改】T4 停靠坞 X 坐标
variable_t4_dock_y: -27.90               # 【必改】T4 停靠坞 Y 坐标
variable_t5_dock_x: 120.60               # 【必改】T5 停靠坞 X 坐标
variable_t5_dock_y: -27.90               # 【必改】T5 停靠坞 Y 坐标
variable_t6_dock_x: 85.20               # 【必改】T6 停靠坞 X 坐标
variable_t6_dock_y: -27.90               # 【必改】T6 停靠坞 Y 坐标
variable_t7_dock_x: 49.90               # 【必改】T7 停靠坞 X 坐标
variable_t7_dock_y: -27.90               # 【必改】T7 停靠坞 Y 坐标
variable_t8_dock_x: 13.70               # 【必改】T8 停靠坞 X 坐标
variable_t8_dock_y: -27.90               # 【必改】T8 停靠坞 Y 坐标

gcode:
    # 仅作变量容器             # 保留空 gcode，避免 Klipper 认为宏无内容


#####################################################################
# 释放热端：将当前热端放回停靠坞
#####################################################################
# CxChanger 放回工具动作，由 multitool_release_tool 转发调用
[gcode_macro _release_tool]
description: 【换头】把热端放回停靠坞的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要放回的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 当前工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 当前工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸分离用 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在放回 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}          # 沿 Y 进入 dock 中心
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # Y 后退完成磁吸分离
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 回位闭合摆臂
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 抓取热端：从停靠坞抓起目标热端
#####################################################################
# CxChanger 抓取工具动作，由 multitool_pickup_tool 转发调用
[gcode_macro _pickup_tool]
description: 【换头】从停靠坞抓取热端的机械动作（参数 TOOL）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %} # 读取上方 _multitool_cfg 中的所有变量
    {% set tool = params.TOOL|int %} # 当前需要抓取的工具号，由主插件传入
    {% set prefix = "t" ~ tool %}    # 拼出 t0/t1/t2 这样的变量名前缀

    {% set dock_x = cfg[prefix + "_dock_x"] %} # 目标工具停靠坞中心 X
    {% set dock_y = cfg[prefix + "_dock_y"] %} # 目标工具停靠坞中心 Y
    {% set shift_x = cfg.dock_shift_x %}       # 开合摆臂的 X 横移距离
    {% set dodge_y = cfg.dock_dodge_y %}       # 磁吸结合前的 Y 避让距离
    {% set safe_y  = cfg.dock_safe_y %}        # dock 前方安全入口距离

    M118 正在抓取 T{tool}             # 在前端控制台提示当前动作

    G90                               # 使用绝对坐标，避免受打印文件相对坐标状态影响
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_safe} # 先移动到 dock 前方安全入口
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast} # 进入避让位置，准备开摆臂
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} # X 横移打开/错开摆臂
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} # Y 前进让磁吸工具结合
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}           # X 回位闭合摆臂并锁定工具

    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}  # 带着工具退出到 dock 前方安全入口
    M400                              # 等待所有运动完成，确保主流程后续状态正确


#####################################################################
# 2. 用户钩子：放回热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>，框架已做好 G90 / Z 抬升 / accel 切换 / 入口夹紧自检。
#    在这里写"把 T{tool} 热端放回坞"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_release_tool]
description: 【换头】插件钩子：放回热端，转发到 _release_tool
gcode:
    _release_tool TOOL={params.TOOL}

#####################################################################
# 2. 用户钩子：抓取热端  (默认实现 = 报错，必须替换)
#
#    入参 TOOL=<int>。
#    在这里写"从坞中抓起 T{tool} 热端"的机械动作。
#
#    动作结束记得用 M400 等待运动队列清空。
#####################################################################
[gcode_macro multitool_pickup_tool]
description: 【换头】插件钩子：抓取热端，转发到 _pickup_tool
gcode:
    _pickup_tool TOOL={params.TOOL}


#####################################################################
# 停靠坞坐标调试（打印时不会调用）
#
#   DOCK_MOVE X=283.11 Y=-28.07          移动到输入的坐标（进坞时先在最近坞的进坞 X 推进去再横移；出坞时先回进坞 X 再退出）
#   DOCK_SAVE TOOL=0 TYPE=进坞           保存当前坐标；TYPE：进坞 / 停靠 / 撞机
#   DOCK_SAVE TOOL=0 TYPE=进坞 X=.. Y=.. 不移动，直接保存（修改）输入的坐标
#   DOCK_POINTS                          弹窗：按打印头列出已保存的坐标，可移动到、删除；放回 / 抓取 / 多次取放测试
#   DOCK_TEST TOOL=0 MODE=取放 COUNT=5   取放测试；MODE：放回 / 抓取 / 取放（放回 + 抓取，重复 COUNT 次）
#
# 在 Mainsail / Fluidd 的宏面板里点宏按钮旁的箭头，会出现参数输入框。
#
# 坐标类型：
#   进坞：热端在坞里卡到位的 X、Y      → 这个头的进坞 X（tN_dock_x）、推入深度（tN_dock_y）
#   停靠：横移到挤出机打开的 X          → 横移量 dock_shift_x = 停靠 X - 进坞 X（所有头共用）
#   撞机：再往左就撞的 X               → 只显示安全余量 = 停靠 X - 撞机 X
#
# 坐标存在 myvariables.cfg（dock_pt_t0_entry 等），保存后马上生效，开机自动加载；
# 没保存的头仍用上面 _multitool_cfg 里写的值。
#####################################################################
[gcode_macro DOCK_MOVE]
description: 【换头】移动到输入的坐标 X、Y（进坞时先在进坞 X 推进去再横移，出坞时先回进坞 X 再退出）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set th = printer.toolhead %}
    {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes %}
        G28 X Y
    {% endif %}
    {% set cx = th.position.x|float %}
    {% set cy = th.position.y|float %}
    {% set x = params.X|default(cx)|float %}
    {% set y = params.Y|default(cy)|float %}
    {% if x < th.axis_minimum.x|float or x > th.axis_maximum.x|float or y < th.axis_minimum.y|float or y > th.axis_maximum.y|float %}
        {action_raise_error("坐标 X=%.2f Y=%.2f 超出行程" % (x, y))}
    {% endif %}
    {% set front = (cfg.t0_dock_y|float + cfg.dock_safe_y|float)|round(3) %}
    # 进出坞都走离目标 / 当前位置最近那个坞的进坞 X（横移后的位置不能直接推进去或拉出来）
    {% set best = {'d': 999.0, 'x': x} %}
    {% for t in range(9) %}
        {% if ('t%d_dock_x' % t) in cfg %}
            {% set dx = (cfg['t%d_dock_x' % t]|float - (x if y < front else cx))|abs %}
            {% if dx < best.d %}
                {% set _ = best.update({'d': dx, 'x': cfg['t%d_dock_x' % t]|float}) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% set ex = best.x if best.d < 8 else (x if y < front else cx) %}
    {% set inside = cy < front - 0.5 %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G90
    {% if y < front and not inside %}
        G0 X{ex} Y{front} F{cfg.feed_safe}
        G0 X{ex} Y{y} F{cfg.feed_slow}
        G0 X{x} Y{y} F{cfg.feed_slow}
    {% elif y < front %}
        G0 X{x} Y{y} F{cfg.feed_slow}
    {% elif inside %}
        G0 X{ex} F{cfg.feed_slow}
        G0 X{ex} Y{front} F{cfg.feed_slow}
        G0 X{x} Y{y} F{cfg.feed_safe}
    {% else %}
        G0 X{x} Y{y} F{cfg.feed_safe}
    {% endif %}
    RESPOND MSG="DOCK_MOVE：X {'%.2f' % x}  Y {'%.2f' % y}"

[gcode_macro DOCK_SAVE]
description: 【换头】保存坐标（TOOL=工具号 TYPE=进坞/停靠/撞机；不填 X、Y 就保存当前坐标，填了就保存填的值）
gcode:
    {% set th = printer.toolhead %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set tp = params.TYPE|default('进坞') %}
    {% set key = {'进坞': 'entry', 'entry': 'entry', '停靠': 'dock', 'dock': 'dock', '撞机': 'crash', 'crash': 'crash'}[tp]|default('') %}
    {% if not key %}
        {action_raise_error("TYPE 只能是 进坞 / 停靠 / 撞机")}
    {% endif %}
    {% if ('t%d_dock_x' % tool) not in printer["gcode_macro _multitool_cfg"] %}
        {action_raise_error("没有 T%d" % tool)}
    {% endif %}
    {% if (params.X is not defined or params.Y is not defined) and ('x' not in th.homed_axes or 'y' not in th.homed_axes) %}
        {action_raise_error("还没归位，当前坐标不准；先 G28，或者直接填 X、Y")}
    {% endif %}
    {% set x = params.X|default(th.position.x)|float|round(2) %}
    {% set y = params.Y|default(th.position.y)|float|round(2) %}
    SAVE_VARIABLE VARIABLE=dock_pt_t{tool}_{key} VALUE=[{x},{y}]
    RESPOND MSG="DOCK_SAVE：T{tool} {tp}点 = X {'%.2f' % x}  Y {'%.2f' % y}"
    _DOCK_APPLY

[gcode_macro DOCK_POINTS]
description: 【换头】弹窗：按打印头列出已保存的坐标（可移动到、删除），以及放回 / 抓取 / 多次取放测试
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set svv = printer.save_variables.variables %}
    {% set n = printer.configfile.settings.multitool.tool_count|default(1)|int %}
    {% set names = {'entry': '进坞', 'dock': '停靠', 'crash': '撞机'} %}
    {% set B = 'RESPOND TYPE=command MSG="action:prompt_' %}
    {B}begin 停靠坞坐标"
    {B}text 横移量 {'%.2f' % cfg.dock_shift_x|float}｜后退距离 {'%.2f' % cfg.dock_dodge_y|float}｜移动用 DOCK_MOVE，保存用 DOCK_SAVE（宏面板里填 X、Y、TOOL、TYPE）"
    {% for t in range(n) %}
        {B}text ── T{t}：进坞 X {'%.2f' % cfg['t%d_dock_x' % t]|float}  推入深度 Y {'%.2f' % cfg['t%d_dock_y' % t]|float} ──"
        {% set e = svv['dock_pt_t%d_entry' % t]|default(none) %}
        {% set k = svv['dock_pt_t%d_dock' % t]|default(none) %}
        {% set c = svv['dock_pt_t%d_crash' % t]|default(none) %}
        {% for key in ('entry', 'dock', 'crash') %}
            {% set p = svv['dock_pt_t%d_%s' % (t, key)]|default(none) %}
            {% if p %}
        {B}button_group_start"
        {B}button {names[key]}点 X {'%.2f' % p[0]}  Y {'%.2f' % p[1]}  → 移到这里|DOCK_MOVE X={p[0]} Y={p[1]}|secondary"
        {B}button 删除|_DOCK_DEL TOOL={t} KEY={key}|error"
        {B}button_group_end"
            {% endif %}
        {% endfor %}
        {% if not (e or k or c) %}
        {B}text （还没有保存坐标）"
        {% endif %}
        {% if k and c %}
        {B}text 安全余量 = 停靠 X - 撞机 X = {'%.2f' % (k[0] - c[0])} mm"
        {% endif %}
        {B}button_group_start"
        {B}button T{t} 放回测试|DOCK_TEST TOOL={t} MODE=放回|primary"
        {B}button T{t} 抓取测试|DOCK_TEST TOOL={t} MODE=抓取|primary"
        {B}button T{t} 取放 5 次|DOCK_TEST TOOL={t} MODE=取放 COUNT=5|info"
        {B}button_group_end"
    {% endfor %}
    {B}footer_button 刷新|DOCK_POINTS|secondary"
    {B}footer_button 关闭|RESPOND TYPE=command MSG=action:prompt_end|error"
    {B}show"

[gcode_macro _DOCK_DEL]
description: 【换头】删除一个已保存的停靠坞坐标（内部宏）
gcode:
    SAVE_VARIABLE VARIABLE=dock_pt_t{params.TOOL|int}_{params.KEY} VALUE=None
    RESPOND MSG="已删除 T{params.TOOL|int} 的 {params.KEY} 点"
    _DOCK_APPLY
    DOCK_POINTS

[gcode_macro DOCK_TEST]
description: 【换头】取放测试（TOOL=工具号 MODE=放回/抓取/取放 COUNT=取放次数，默认取放 5 次）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set th = printer.toolhead %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set mode = {'放回': 'release', 'release': 'release', '抓取': 'pickup', 'pickup': 'pickup', '取放': 'cycle', 'cycle': 'cycle'}[params.MODE|default('取放')]|default('') %}
    {% if not mode %}
        {action_raise_error("MODE 只能是 放回 / 抓取 / 取放")}
    {% endif %}
    {% if ('t%d_dock_x' % tool) not in cfg %}
        {action_raise_error("没有 T%d" % tool)}
    {% endif %}
    {% set front = cfg['t%d_dock_y' % tool]|float + cfg.dock_safe_y|float %}
    {% if 'x' in th.homed_axes and 'y' in th.homed_axes and th.position.y < front - 0.5 %}
        {action_raise_error("打印头在坞附近（Y=%.2f），先 DOCK_MOVE 退到 Y≥%.2f" % (th.position.y, front))}
    {% endif %}
    {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes %}
        G28 X Y
    {% endif %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G90
    {% if mode == 'release' %}
        _release_tool TOOL={tool}
    {% elif mode == 'pickup' %}
        _pickup_tool TOOL={tool}
    {% else %}
        {% for i in range(params.COUNT|default(5)|int) %}
            RESPOND MSG="T{tool} 取放第 {i + 1} 次"
            _release_tool TOOL={tool}
            _pickup_tool TOOL={tool}
        {% endfor %}
    {% endif %}
    RESPOND MSG="T{tool} {'放回' if mode == 'release' else ('抓取' if mode == 'pickup' else '取放')}测试完成，看一下是否正确、有没有撞击"

[gcode_macro _DOCK_APPLY]
description: 【换头】把已保存的停靠坞坐标设到 _multitool_cfg（保存、删除、开机时自动调用，内部宏）
gcode:
    {% set cfg = printer["gcode_macro _multitool_cfg"] %}
    {% set svv = printer.save_variables.variables %}
    {% set shift = [] %}
    {% for t in range(9) %}
        {% set e = svv['dock_pt_t%d_entry' % t]|default(none) %}
        {% set k = svv['dock_pt_t%d_dock' % t]|default(none) %}
        {% if e and ('t%d_dock_x' % t) in cfg %}
            SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{t}_dock_x VALUE={e[0]}
            SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=t{t}_dock_y VALUE={e[1]}
            {% if k and not shift %}
                {% set _ = shift.append((k[0] - e[0])|round(2)) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if shift %}
        SET_GCODE_VARIABLE MACRO=_multitool_cfg VARIABLE=dock_shift_x VALUE={shift[0]}
    {% endif %}

# 开机：把旧版 DOCK_TUNE 的记录转成坐标（只做一次），然后加载已保存的坐标
[delayed_gcode _DOCK_LOAD]
initial_duration: 1
gcode:
    {% set svv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% if svv['dock_pt_t0_entry'] is not defined and svv['dock_t0_xmax'] is defined and svv['dock_t0_comp'] is defined and svv['dock_t0_ymin'] is defined %}
        {% set comp = svv['dock_t0_comp']|float %}
        {% set ymin = svv['dock_t0_ymin']|float %}
        {% for t in range(9) %}
            {% if svv['dock_t%d_xmax' % t] is defined and svv['dock_t%d_xmax' % t] is not none %}
                SAVE_VARIABLE VARIABLE=dock_pt_t{t}_entry VALUE=[{(svv['dock_t%d_xmax' % t]|float - comp)|round(2)},{ymin|round(2)}]
            {% endif %}
        {% endfor %}
        {% if svv['dock_t0_xdock'] is defined and svv['dock_t0_xdock'] is not none %}
            SAVE_VARIABLE VARIABLE=dock_pt_t0_dock VALUE=[{svv['dock_t0_xdock']|float|round(2)},{ymin|round(2)}]
        {% endif %}
        {% if svv['dock_t0_xcrash'] is defined and svv['dock_t0_xcrash'] is not none %}
            SAVE_VARIABLE VARIABLE=dock_pt_t0_crash VALUE=[{svv['dock_t0_xcrash']|float|round(2)},{ymin|round(2)}]
        {% endif %}
        RESPOND MSG="停靠坞坐标：已把旧记录转换为进坞 / 停靠 / 撞机点"
    {% endif %}
    _DOCK_APPLY
