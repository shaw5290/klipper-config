#####################################################################
# 模块：多热端 XY/Z 偏移校准（涡流对刀）
#
# 主板上的对刀线圈 calibrator_xy、校准参数、单个/批量工具校准宏。
#
# 依赖：multitool/multitool_plugin.cfg（T 命令、SAVE_VARIABLE）、probe/eddy_tgl36v3.cfg（PROBE METHOD=tap）
# 提供：[tool_eddy_calibration calibrator_xy]、CALIBRATE_TOOL、CALIBRATE_ALL_TOOLS、TOOL_OFFSET_TEST、TOOL_OFFSET_SET、TOOL_Z_CALIBRATE
#####################################################################

#换热端项目涡流对刀配置 https://github.com/cx330-TXY/Simple-Multi-Hotend
# 对刀插件 tool_eddy_calibration: https://github.com/chengxg/tool_eddy_calibration
# 教程: https://demo.chengxg.top/pangxie/articles/eddy-calibration/
# 检测线圈是否正常: TEST_LDC1612（谐振频率约 2.2MHz）
# 寻找中心点: TOOL_EDDY_CALIBRATE TOOL=0 DIR=45,135 REPEATS=1
# 查询校准结果: GET_TOOL_CENTER TOOL=0
# 设置工具Z坐标: SET_TOOL_Z TOOL=0 Z=-0.1
# 清除扫描中心点位置:  CLEAR_TOOL_CENTER TOOL=0
# 线圈驱动电流校准命令: LDC_CALIBRATE_DRIVE_CURRENT CHIP=calibrator_xy
[tool_eddy_calibration calibrator_xy]
sensor_type: ldc1612
frequency: 40000000
reg_drive_current: 22     # 如果使用校准驱动电流命令这个注释
max_sensor_hz: 3000000    # 线圈最大频率
# LDC1612 I2C 配置
i2c_speed: 400000
i2c_address: 42           # 地址跳线连接
i2c_mcu: mcu              # 改成自己的
i2c_software_scl_pin: PA8 # 改成自己的
i2c_software_sda_pin: PC9 # 改成自己的
# PCB线圈位置 大概位置
coil_x: 168.08     # T0 扫描实测中心（3 次平均 168.084），粗略位置为 168.16
coil_y: 283.75    # T0 扫描实测中心（3 次平均 283.748），粗略位置为 284.85
coil_z: 0.85  # 实测：喷嘴垫纸(约0.1mm)有轻微阻力时 Z=0.95，线圈平面约 0.85
coil_inner_diameter: 2.0    #线圈内径
# 扫描参数
scan_height: 0.5            # 喷嘴扫描时在 Z=coil_z+0.5=1.35, 扫描高度, 距离pcb线圈中心点的高度, 以coil_z为基准再次提高的高度, 喷嘴扫描高度距离线圈高度为0.5mm左右
scan_speed: 4.0             # 扫描速度, 速度低了效果不一定好
scan_length: 4.0            # 扫描长度, 至少要覆盖线圈内径
scan_safe_z: 2.0            # 安全Z高度, 比scan_height高就行
travel_speed_xy: 100.0      # XY旅行速度
travel_speed_z: 10.0        # Z旅行速度
save_data: True             # 是否保存探测数据到csv文件

[gcode_macro _TOOL_CALIB_VARS]
description: 【对刀】对刀参数（安全位置、线圈坐标等），仅存放变量
variable_safe_x: 20.0        # 改成自己的 换刀/待机的安全区域X 喷嘴戳热床位置
variable_safe_y: 35.0        # 改成自己的 换刀/待机的安全区域Y 喷嘴戳热床位置
variable_safe_z: 5.0         # 改成自己的 换刀/待机的安全区域Z高度
variable_tool_count: 2       # 改成自己的 工具总数 (例如0, 1，共2个)；必须与 multitool_plugin.cfg 的 [multitool] tool_count 一致
gcode:
    # 此处无需指令，仅用于存储变量


# 校准单个工具
# 调用示例: CALIBRATE_TOOL TOOL=1
# 只保存 X、Y 偏移；Z 偏移不保存（涡流测的 Z 效果不好，Z 偏移手动设置），见 _DO_SAVE_CALIB_RESULT 里注释掉的那一行
# ---------------------------------------------------------
[gcode_macro CALIBRATE_TOOL]
description: 【对刀】校准指定编号的单个工具（加热、探测Z、测XY偏移并保存；Z 偏移不保存，手动设置）
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS"] %}

    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    T{tool}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    M109 S150 T{tool}     # 加热到150度
    # CLEAN_NOZZLE # 看情况自己设置磨嘴, 要不然不准
    # 使用能够喷嘴限位的probe得到Z偏移
    PROBE METHOD=tap SAMPLES=3
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    DO_CALIBRATE_TOOL TOOL={tool}
    _DO_SAVE_CALIB_RESULT TOOL={tool}
    M400   # 【关键】等待动作走完
    G90

[gcode_macro DO_CALIBRATE_TOOL]
description: 【对刀】执行单个工具的涡流/XY偏移核心校准动作
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set probeZ = printer.probe.last_probe_position.z %}
    # 清除上次的中心点位置
    CLEAR_TOOL_CENTER TOOL={tool}
    # 设置 使用喷嘴限位的probe探测到的Z位置
    SET_TOOL_Z TOOL={tool} Z={probeZ}
    {% set tool0ProbeZ = 0.0 %}
    {% if '0' in printer["tool_eddy_calibration calibrator_xy"] %}
      {% set tool0ProbeZ = printer["tool_eddy_calibration calibrator_xy"]["0"].z %}
    {% endif %}
    # 进行XY偏移校准, 设置一个相对于tool0的z偏移, 避免喷嘴碰到线圈
    TOOL_EDDY_CALIBRATE TOOL={tool} DIR=0,90 PAIR_CANCEL=0 SCAN_HEIGHT_OFFSET={probeZ-tool0ProbeZ}

[gcode_macro _DO_SAVE_CALIB_RESULT]
description: 【对刀】保存当前工具的校准偏移结果到变量中（内部宏）
gcode:
    {% set tool = params.TOOL|int %}
    {% set res0 = printer["tool_eddy_calibration calibrator_xy"]["0"] %}
    {% set res = printer["tool_eddy_calibration calibrator_xy"][tool|string] %}
   
    {% if tool == 0 %}
        # T0 永远存 0
        SAVE_VARIABLE VARIABLE=t0_offset_x VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_y VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_z VALUE=0.0
        {action_respond_info("✅ T0 基准点坐标已锁定")}
    {% else %}
        # 其他工具存探测结果
        SAVE_VARIABLE VARIABLE=t{tool}_offset_x VALUE={(res.x-res0.x)|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_y VALUE={(res.y-res0.y)|round(4)}
        # 涡流 tap 测出的 Z 偏移效果不好，不再保存，Z 偏移手动设置（SAVE_VARIABLE VARIABLE=t1_offset_z VALUE=…）
        # 需要恢复用涡流测 Z 时，去掉下面一行的注释
        # SAVE_VARIABLE VARIABLE=t{tool}_offset_z VALUE={(res.z-res0.z)|round(4)}
        {action_respond_info("T" ~ tool ~ " 只更新 XY 偏移，Z 偏移保持原值")}
        {action_respond_info("✅ T" ~ tool ~ " 偏移量已自动保存")}
    {% endif %}


# ---------------------------------------------------------
# 批量校准所有工具
# ---------------------------------------------------------
[gcode_macro CALIBRATE_ALL_TOOLS]
description: 【对刀】一键全自动批量校准所有配置的工具
gcode:
    # 悬浮弹窗提示当前执行的方法名
    {action_respond_info("▶ [运行宏] 批量校准所有工具 (开始流程)")}
    
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS"] %}
    {action_respond_info("开始全自动工具校准流程...")}
    # 全部预加热到150度, 注意电源功率
    {% for t in range(0, vars.tool_count) %}
        M104 S150 T{t}
    {% endfor %}
    # 遍历所有工具 (range(0, N) 生成 0 到 N-1)
    {% for t in range(0, vars.tool_count) %}
        CALIBRATE_TOOL TOOL={t}
    {% endfor %}
    # 关闭加热
    {% for t in range(0, vars.tool_count) %}
        M104 S0 T{t}
    {% endfor %}
    untool
    {action_respond_info("所有工具校准完毕")}


# ---------------------------------------------------------
# 偏移打印测试：在热床 3～4 个点上，T0 打外框、T1 打内框，看 XY 对齐和 Z 高度
#   TOOL_OFFSET_TEST                    默认：喷嘴 220°C、热床 60°C、4 个点
#   TOOL_OFFSET_TEST TEMP=230 BED=70 POINTS=3
# 每个点：T0 外框 20×20 mm、T1 内框 14×14 mm（同心，各 2 圈，单层 0.2 mm）
#   XY：内外框之间的间隙四周都是 3 mm；哪边窄，T1 就往哪边偏
#   Z ：内框线条和外框一样宽、一样扁；内框又薄又稀 = T1 太低，线是圆的 = T1 太高
# 用当前保存的偏移，不会修改任何偏移
# ---------------------------------------------------------
[gcode_macro TOOL_OFFSET_TEST]
description: 【对刀】偏移打印测试：热床 3～4 个点上 T0 打外框、T1 打内框，看 XY 对齐和 Z 高度（TEMP= BED= POINTS=3/4）
gcode:
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS"] %}
    {% set temp = params.TEMP|default(220)|float %}
    {% set bed = params.BED|default(60)|float %}
    {% set npts = params.POINTS|default(4)|int %}
    {% set tools = range(0, vars.tool_count)|list %}
    {% set th = printer.toolhead %}
    {% set lh = 0.2 %}                                   # 层高
    {% set lw = 0.45 %}                                  # 线宽
    {% set epm = (lw * lh / (3.14159 * 0.875 * 0.875))|round(5) %}   # 每 mm 挤出长度（1.75 耗材）
    {% set cx_mid = th.axis_maximum.x / 2 %}
    {% set cy_mid = th.axis_maximum.y / 2 %}
    {% set all = [[cx_mid - 90, cy_mid - 90], [cx_mid + 90, cy_mid - 90], [cx_mid + 90, cy_mid + 90], [cx_mid - 90, cy_mid + 90]] %}
    {% set pts = all[:3] if npts == 3 else all %}
    {% set sizes = [20, 14, 8, 4] %}                     # T0 外框、T1 内框（多于 2 个头时继续往里缩）

    RESPOND MSG="偏移测试：{tools|length} 个头 × {pts|length} 个点，喷嘴 {temp}°C，热床 {bed}°C"
    M140 S{bed}
    {% for t in tools %}
        M104 T{t} S{temp}
    {% endfor %}
    {% if th.homed_axes != 'xyz' %}
        G28
    {% endif %}
    M190 S{bed}
    {% if 'bed_mesh' in printer and 'default' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    {% for t in tools %}
        {% set half = sizes[loop.index0] / 2 %}
        T{t}
        M109 T{t} S{temp}
        G90
        M83
        G92 E0
        # 前边缘画一条预挤出线，把喷嘴里的料理顺
        G1 Z2 F600
        G1 X{20 + t * 10} Y5 F6000
        G1 Z{lh} F600
        G1 E2 F300
        G1 X{100 + t * 10} E{(80 * epm * 1.5)|round(4)} F1200
        G1 E-0.8 F1800
        G1 Z2 F600
        {% for p in pts %}
            {% set x0 = (p[0] - half)|round(3) %}
            {% set x1 = (p[0] + half)|round(3) %}
            {% set y0 = (p[1] - half)|round(3) %}
            {% set y1 = (p[1] + half)|round(3) %}
            G1 X{x0} Y{y0} F6000
            G1 Z{lh} F600
            G1 E0.8 F1800
            {% for r in range(2) %}
                {% set d = r * lw %}
                {% set a0 = (x0 + d)|round(3) %}
                {% set a1 = (x1 - d)|round(3) %}
                {% set b0 = (y0 + d)|round(3) %}
                {% set b1 = (y1 - d)|round(3) %}
                {% set side = a1 - a0 %}
                G1 X{a0} Y{b0} F1200
                G1 X{a1} Y{b0} E{(side * epm)|round(4)} F1200
                G1 X{a1} Y{b1} E{(side * epm)|round(4)} F1200
                G1 X{a0} Y{b1} E{(side * epm)|round(4)} F1200
                G1 X{a0} Y{b0} E{(side * epm)|round(4)} F1200
            {% endfor %}
            G1 E-0.8 F1800
            G1 Z2 F600
        {% endfor %}
        RESPOND MSG="偏移测试：T{t} 打完（{'外' if t == 0 else '内'}框 {sizes[loop.index0]} mm）"
    {% endfor %}
    T{tools[0]}
    G1 Z10 F600
    G1 X{cx_mid} Y{th.axis_maximum.y - 10} F6000
    {% for t in tools %}
        M104 T{t} S0
    {% endfor %}
    RESPOND MSG="偏移测试完成：看每个点内外框的间隙是否四周均匀（XY），内框线条是否和外框一样（Z）"


# ---------------------------------------------------------
# 手动设置偏移（不用重启，马上生效）
#   TOOL_OFFSET_SET TOOL=1 Z=-0.12            直接设成这个值
#   TOOL_OFFSET_SET TOOL=1 DX=-0.2 DZ=0.03    在现在的值上加减（看完 TOOL_OFFSET_TEST 的偏差直接填）
# 改的是 myvariables.cfg 里原有的 tN_offset_x/y/z；改的是当前装着的头时立即应用，否则下次换到它时生效
# ---------------------------------------------------------
[gcode_macro TOOL_OFFSET_SET]
description: 【对刀】手动设置偏移，不用重启（TOOL=工具号；X/Y/Z 直接设值，DX/DY/DZ 在现有值上加减）
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set cur = printer.multitool.current_tool|int if 'multitool' in printer else -1 %}
    {% set tool = params.TOOL|default(cur)|int %}
    {% if tool < 0 %}
        {action_raise_error("请填 TOOL")}
    {% endif %}
    {% set new = {} %}
    {% set msg = [] %}
    {% for ax in ['x', 'y', 'z'] %}
        {% set key = 't%d_offset_%s' % (tool, ax) %}
        {% set old = svv[key]|default(0)|float %}
        {% set A = ax|upper %}
        {% if params[A] is defined %}
            {% set v = params[A]|float %}
        {% elif params['D' ~ A] is defined %}
            {% set v = old + params['D' ~ A]|float %}
        {% else %}
            {% set v = old %}
        {% endif %}
        {% set v = v|round(4) %}
        {% set _ = new.update({ax: v}) %}
        {% if v != old %}
            SAVE_VARIABLE VARIABLE={key} VALUE={v}
            {% set _ = msg.append('%s %.4f → %.4f' % (A, old, v)) %}
        {% endif %}
    {% endfor %}
    {% if not msg %}
        {action_raise_error("没有要改的值，填 X/Y/Z 或 DX/DY/DZ")}
    {% endif %}
    {% if tool == cur %}
        SET_GCODE_OFFSET X={new.x} Y={new.y} Z={new.z} MOVE=0
    {% endif %}
    RESPOND MSG="T{tool} 偏移：{msg|join('，')}{'（已立即应用）' if tool == cur else '（下次换到 T%d 时生效）' % tool}"


# ---------------------------------------------------------
# 多热端 Z 偏移手动校准（和涡流第一次校准一样的垫纸弹窗）
#   TOOL_Z_CALIBRATE TOOL=1              在热床中间测
#   TOOL_Z_CALIBRATE TOOL=1 X=150 Y=150 TEMP=150
# 流程：T0 垫纸 TESTZ → ACCEPT → 确认 → 换 T1 到同一点 垫纸 TESTZ → ACCEPT → 确认 → 保存 t1_offset_z
# 两次用同一张纸、同一个点，纸厚抵消；保存后马上生效，不用重启
# ---------------------------------------------------------
[gcode_macro TOOL_Z_CALIBRATE]
description: 【对刀】多热端 Z 偏移手动校准：T0、T1 在同一点垫纸 TESTZ → ACCEPT，自动算出并保存 T1 的 Z 偏移（TOOL= X= Y= TEMP=）
variable_tool: 1
variable_cur: 0
variable_x: 0.0
variable_y: 0.0
variable_temp: 0.0
variable_z0: 0.0
variable_zt: 0.0
gcode:
    {% set th = printer.toolhead %}
    {% set tool = params.TOOL|default(1)|int %}
    {% if tool == 0 %}
        {action_raise_error("T0 是基准，Z 偏移固定为 0；TOOL 填要校准的头，比如 1")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_CALIBRATE VARIABLE=tool VALUE={tool}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_CALIBRATE VARIABLE=x VALUE={params.X|default(th.axis_maximum.x / 2)|float}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_CALIBRATE VARIABLE=y VALUE={params.Y|default(th.axis_maximum.y / 2)|float}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_CALIBRATE VARIABLE=temp VALUE={params.TEMP|default(0)|float}
    {% if th.homed_axes != 'xyz' %}
        G28
    {% endif %}
    _TZC_PROBE T=0

[gcode_macro _TZC_PROBE]
description: 【对刀】TOOL_Z_CALIBRATE：换到指定头、移到测量点、开始垫纸手动探测（内部宏）
gcode:
    {% set st = printer["gcode_macro TOOL_Z_CALIBRATE"] %}
    {% set t = params.T|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=TOOL_Z_CALIBRATE VARIABLE=cur VALUE={t}
    G90
    G1 Z5 F600
    T{t}
    {% if st.temp|float > 0 %}
        M109 T{t} S{st.temp}
    {% endif %}
    SET_GCODE_OFFSET Z=0 MOVE=0
    G90
    G1 Z5 F600
    G1 X{st.x} Y{st.y} F6000
    G1 Z1 F600
    RESPOND MSG="T{t}：在喷嘴下垫一张纸，用 TESTZ 调到抽纸有轻微阻力，点 ACCEPT"
    MANUAL_PROBE
    UPDATE_DELAYED_GCODE ID=_TZC_WAIT DURATION=1

[delayed_gcode _TZC_WAIT]
gcode:
    {% if printer.manual_probe.is_active %}
        UPDATE_DELAYED_GCODE ID=_TZC_WAIT DURATION=1
    {% else %}
        {% set st = printer["gcode_macro TOOL_Z_CALIBRATE"] %}
        {% set z = printer.toolhead.position.z|round(3) %}
        {% set t = st.cur|int %}
        SET_GCODE_VARIABLE MACRO=TOOL_Z_CALIBRATE VARIABLE=zt VALUE={z}
        RESPOND TYPE=command MSG="action:prompt_begin Z 偏移校准：T{t}"
        RESPOND TYPE=command MSG="action:prompt_text T{t} 测得 Z = {'%.3f' % z}（点了 ABORT 的话这个值无效，选重测）"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button 使用这个值|_TZC_USE|primary"
        RESPOND TYPE=command MSG="action:prompt_button 重测 T{t}|_TZC_PROBE T={t}|secondary"
        RESPOND TYPE=command MSG="action:prompt_button 取消|_TZC_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _TZC_USE]
description: 【对刀】TOOL_Z_CALIBRATE：确认当前测得的 Z（内部宏）
gcode:
    {% set st = printer["gcode_macro TOOL_Z_CALIBRATE"] %}
    {% if st.cur|int == 0 %}
        SET_GCODE_VARIABLE MACRO=TOOL_Z_CALIBRATE VARIABLE=z0 VALUE={st.zt}
        RESPOND MSG="T0 基准 Z = {'%.3f' % st.zt|float}，接着测 T{st.tool|int}"
        _TZC_PROBE T={st.tool|int}
    {% else %}
        {% set off = (st.zt|float - st.z0|float)|round(4) %}
        {% set old = printer.save_variables.variables['t%d_offset_z' % st.tool|int]|default(0)|float %}
        G1 Z5 F600
        RESPOND TYPE=command MSG="action:prompt_begin Z 偏移校准：结果"
        RESPOND TYPE=command MSG="action:prompt_text T{st.tool|int} Z 偏移 = T{st.tool|int} {'%.3f' % st.zt|float} - T0 {'%.3f' % st.z0|float} = {'%.4f' % off}（原来 {'%.4f' % old}）"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button 保存|_TZC_SAVE OFF={off}|primary"
        RESPOND TYPE=command MSG="action:prompt_button 重测 T{st.tool|int}|_TZC_PROBE T={st.tool|int}|secondary"
        RESPOND TYPE=command MSG="action:prompt_button 取消|_TZC_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _TZC_SAVE]
description: 【对刀】TOOL_Z_CALIBRATE：保存 Z 偏移（内部宏）
gcode:
    {% set st = printer["gcode_macro TOOL_Z_CALIBRATE"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    TOOL_OFFSET_SET TOOL={st.tool|int} Z={params.OFF|float}
    G90
    G1 Z10 F600

[gcode_macro _TZC_CANCEL]
description: 【对刀】TOOL_Z_CALIBRATE：取消（内部宏）
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer.manual_probe.is_active %}
        ABORT
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_TZC_WAIT DURATION=0
    G90
    G1 Z10 F600
    RESPOND MSG="Z 偏移校准已取消，偏移没有修改"
