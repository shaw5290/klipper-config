#####################################################################
# 模块：多热端切换插件 klipper-multitool
#
# [multitool] 主配置、持久化变量、M104/M109 覆写、偏移与计时统计。
# 换头动作钩子（multitool_release_tool / multitool_pickup_tool）在换头方案模块中。
#
# 依赖：multitool/multihotend.cfg、一个换头方案模块（如 multitool/changer_cxchanger.cfg）
# 提供：[save_variables] [multitool] T0..Tn / UNTOOL / M104 / M109 / TOOLCHANGE_TEST
#####################################################################

#####################################################################
# klipper-multitool-stats - 默认配置文件
#
# 此文件由 install.sh 自动复制到 ~/printer_data/config/multitool/。
# 你应该：
#   1. 修改下面的 [multitool] 字段（tool_count / z_hop / accel 等）
#   2. 替换 multitool_release_tool / multitool_pickup_tool 两个钩子宏
#      的实现，写入你机器的真实换头动作
#
# 重要：默认钩子实现会直接 action_raise_error 报错。
#       不替换钩子无法完成换头。
#####################################################################


#####################################################################
# 持久化变量
#####################################################################
[save_variables]
filename: ~/printer_data/config/myvariables.cfg


#####################################################################
# 多热端切换插件主配置
#   T0..T{n-1} / UNTOOL / CHANGE_TOOL / QUERY_TOOL_STATUS / 状态恢复
#####################################################################
[multitool]
# tool_count: 8            # 热端数量
tool_count: 2            # 热端数量
# tool_count: 4            # 热端数量
# tool_count: 1            # 热端数量
z_hop: 0.4               # 换头抬升高度
feed_z: 600              # 抬升速度 (mm/min)
accel_swap: 8000         # 换头期间加速度
untool_safe_z: 10        # 上次为"无热端"时第一动作要抬到的安全 Z
untool_unhomed_prepare: True  # UNTOOL 时若 XYZ 未完整归位，先归位缺失的 XY 轴、临时设置 Z=0 并抬升 10mm
sync_active_spool: True  # 换头后同步 Spoolman 当前料盘
sync_active_extruder: True  # 换头后同步 Klipper active extruder
sync_extruder_motion: True  # 共用物理 E 步进时，同步该步进到当前热端队列；独立 E 步进机器设 False
extruder_motion_sync_stepper: extruder  # 需要同步运动队列的共享 E 步进名
default_pressure_advance_extruder: extruder  # 共用物理 E 步进时，将未指定 EXTRUDER 的 SET_PRESSURE_ADVANCE 作用到该步进
extrude_compensation_length: 3.0  # 释放前回抽/抓取后挤出补偿共用长度(mm)，0=关闭
extrude_compensation_speed: 1800  # 回抽和挤出补偿共用速度(mm/min)


#####################################################################
# 温度命令覆写：M104 / M109 默认作用于当前工具
#
#   覆写入口保留在配置中，原始 Klipper 命令会保留为 M99104 / M99109。
#   断料续打组实际工具解析由 [multitool] Python 辅助命令统一完成。
#
#   - 未传 T 时：当前有热端则用 current_tool；无热端则默认 T0。
#   - 若目标工具无耗材且在 continuation_groups 中，则复用
#     multitool_filament 的同一套续打组解析逻辑选择实际工具；普通降温也
#     会解析实际工具。组内无可用工具时，按传入工具执行。
#     只有断料续打内部关闭旧热端时会显式绕过该解析。
#   - M109 会先设温，再用 TEMPERATURE_WAIT 等待目标温度 ±1.5°C。
#   - 目标温度低于 50°C 时只设温不等待，避免 M109 S0 长时间等待冷却。
#####################################################################
[gcode_macro M104]
description: 【温度】设置热端温度不等待；未指定 T 时作用于当前热端（参数 S、T）
rename_existing: M99104
gcode:
    {% set s = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% set target = s if s > 0 else r %}
    {% set mt = printer.multitool %}
    {% set requested = params.T|int if params.T is defined
                     else (mt.current_tool|int if mt.current_tool|int >= 0 else 0) %}
    MULTITOOL_SET_TEMPERATURE TOOL={requested} S={s} R={r} COMMAND=M104

[gcode_macro M109]
description: 【温度】设置热端温度并等待到温；未指定 T 时作用于当前热端（参数 S、T）
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% set target = s if s > 0 else r %}
    {% set mt = printer.multitool %}
    {% set requested = params.T|int if params.T is defined
                     else (mt.current_tool|int if mt.current_tool|int >= 0 else 0) %}
    M104 T{requested} S{target}
    {% if target >= 50 %}
        MULTITOOL_WAIT_TEMPERATURE TOOL={requested} S={s} R={r} COMMAND=M109
    {% endif %}


# 偏移管理（可选）
[multitool_offsets]
z_offset_adaptive: False        # 启用 Z 偏移自适应 (用于压力Z限位/Tap)

# 换头计时统计（可选）
[multitool_stats]


#####################################################################
# 换头测试：反复取放热端，检查换头动作是否稳定
#
#   TOOLCHANGE_TEST TOOL=0 COUNT=10
#       T0 抓取 → 放回，重复 10 次
#   TOOLCHANGE_TEST TOOLS=0,1 COUNT=10
#       T0 → T1 依次切换（和打印时一样直接换头，中间不 UNTOOL），重复 10 轮
#
#   参数：
#     TOOL     单个工具号，默认 0（T0）
#     TOOLS    多个工具号，逗号分隔；给了 TOOLS 就忽略 TOOL
#     COUNT    次数（轮数），默认 5，最多 100
#     REHOME   每多少次重新归位 XY，0 = 不归位（默认）；用来检查是否丢步
#     WAIT     每次换头后停顿的秒数，默认 0；需要观察时设 2～3
#     KEEP     1 = 结束时保留最后一个工具在打印头上；默认 0，结束时 UNTOOL
#
#   开始前打印头上有热端时，会先 UNTOOL 放回。
#   换头过程中出错（撞、超出行程等）会立即停止。
#####################################################################
[gcode_macro TOOLCHANGE_TEST]
description: 【换头】反复取放热端测试换头（TOOL=工具号 或 TOOLS=0,1；COUNT=次数；REHOME=每几次归位XY；WAIT=停顿秒数；KEEP=1 保留工具）
gcode:
    {% set mt = printer.multitool %}
    {% set cur = mt.current_tool|int %}
    {% set tool_count = printer.configfile.settings.multitool.tool_count|default(99)|int %}
    {% if params.TOOLS is defined %}
        {% set tools = params.TOOLS.split(',')|map('trim')|map('int')|list %}
    {% else %}
        {% set tools = [params.TOOL|default(0)|int] %}
    {% endif %}
    {% set count = params.COUNT|default(5)|int %}
    {% set rehome = params.REHOME|default(0)|int %}
    {% set wait_ms = (params.WAIT|default(0)|float * 1000)|int %}
    {% set keep = params.KEEP|default(0)|int == 1 %}
    {% set single = tools|length == 1 %}

    {% if count < 1 or count > 100 %}
        {action_raise_error("COUNT 要在 1～100 之间，当前 %d" % count)}
    {% endif %}
    {% for t in tools %}
        {% if t < 0 or t >= tool_count %}
            {action_raise_error("工具号 T%d 不存在（tool_count = %d）" % (t, tool_count))}
        {% endif %}
    {% endfor %}

    {% set names = 'T' ~ tools|join(' → T') %}
    RESPOND MSG="换头测试开始：{names}，{count} {'次' if single else '轮'}"
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if cur >= 0 %}
        UNTOOL
    {% endif %}

    {% for i in range(count) %}
        RESPOND MSG="换头测试：第 {i + 1}/{count} {'次' if single else '轮'}"
        {% for t in tools %}
            T{t}
            {% if wait_ms > 0 %}
                G4 P{wait_ms}
            {% endif %}
        {% endfor %}
        {% if single and (keep == false or i + 1 < count) %}
            UNTOOL
            {% if wait_ms > 0 %}
                G4 P{wait_ms}
            {% endif %}
        {% endif %}
        {% if rehome > 0 and (i + 1) % rehome == 0 and i + 1 < count %}
            RESPOND MSG="换头测试：重新归位 XY"
            G28 X Y
        {% endif %}
    {% endfor %}

    {% if not single and not keep %}
        UNTOOL
    {% endif %}
    RESPOND MSG="换头测试完成：{names}，共 {count} {'次' if single else '轮'}，无报错"
