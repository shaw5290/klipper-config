#####################################################################
# 模块：通用功能
#
# SD 卡目录、对象排除、暂停恢复、RESPOND、强制移动等通用功能。
#
# 依赖：无
# 提供：[virtual_sdcard] [exclude_object] [display_status] [pause_resume] [respond] [force_move] MACRO_HELP
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[exclude_object]

[pause_resume]
[display_status]


# #允许未回零操作电机(支持手动移动步进电机进行诊断。)
[force_move]
enable_force_move: true

# #开机后设定当前位置（解锁保护）
[delayed_gcode KINEMATIC_POSITION]
initial_duration:0.2
gcode:
  SET_KINEMATIC_POSITION


# 启用 M118 echo 命令, RESPOND命令支持
[respond]


#####################################################################
# 宏分类帮助
#
# 每个宏的 description 以【分类】开头，本宏按分类列出当前已加载的宏。
# 新增宏时也按这个格式写 description，就会自动出现在对应分类里。
#   MACRO_HELP          列出可直接使用的宏
#   MACRO_HELP ALL=1    同时列出 _ 开头的内部宏
#####################################################################
[gcode_macro MACRO_HELP]
description: 【帮助】按分类列出所有宏；ALL=1 时同时列出 _ 开头的内部宏
gcode:
    {% set show_all = params.ALL|default(0)|int == 1 %}
    {% set order = ['打印', '调平', '探针', '换头', '对刀', '温度', '调试', '帮助'] %}
    {% set cfg = printer.configfile.settings %}
    {% set macros = [] %}
    {% for key in cfg|sort %}
        {% if key.startswith('gcode_macro ') %}
            {% set name = key[12:] %}
            {% if show_all or not name.startswith('_') %}
                {% set desc = cfg[key].description|default('')|string %}
                {% if desc.startswith('【') and '】' in desc %}
                    {% set cat = desc[1:desc.index('】')] %}
                    {% set text = desc[desc.index('】') + 1:] %}
                {% else %}
                    {% set cat = '未分类' %}
                    {% set text = desc %}
                {% endif %}
                {% set _ = macros.append({'cat': cat, 'name': name|upper, 'text': text}) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% set cats = order[:] %}
    {% for m in macros %}
        {% if m.cat not in cats %}
            {% set _ = cats.append(m.cat) %}
        {% endif %}
    {% endfor %}
    {% set lines = [] %}
    {% for c in cats %}
        {% set items = macros|selectattr('cat', 'equalto', c)|list %}
        {% if items %}
            {% set _ = lines.append('【' ~ c ~ '】') %}
            {% for m in items %}
                {% set _ = lines.append('  ' ~ m.name ~ '：' ~ m.text) %}
            {% endfor %}
        {% endif %}
    {% endfor %}
    {action_respond_info(lines|join('\n'))}
