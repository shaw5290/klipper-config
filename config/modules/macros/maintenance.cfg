#####################################################################
# 模块：日常维护与调试
#
# 塞尺测试宏、振动补偿（共振补偿 input shaper）测试宏。调平、网床步骤会按已引用的模块自动跳过。
#
# 依赖：无
# 提供：PAPER_TEST_PREP、PAPER_TEST、SHAPER_TEST
#####################################################################

# 塞尺测试准备: 归零 -> 三点调平 -> 重新Z归零 -> 关闭网床补偿
[gcode_macro PAPER_TEST_PREP]
description: 【调试】塞尺测试准备, 调平后关闭网床补偿
gcode:
  G28
  {% if 'z_tilt' in printer %}
  Z_TILT_ADJUST
  G28 Z
  {% endif %}
  {% if 'bed_mesh' in printer %}
  BED_MESH_CLEAR
  {% endif %}
  G90
  G1 Z10 F600
  RESPOND MSG="准备完成, 依次执行 PAPER_TEST POINT=1~4"

# 塞尺测试: POINT=1左前 2右前 3左后 4右后, 喷嘴降到 Z=0.2
[gcode_macro PAPER_TEST]
description: 【调试】塞尺测试, POINT=1左前 2右前 3左后 4右后
gcode:
  {% set points = {1: [40, 40, "左前"], 2: [250, 40, "右前"], 3: [40, 270, "左后"], 4: [250, 270, "右后"]} %}
  {% set p = params.POINT|default(1)|int %}
  {% if p not in points %}
    {action_raise_error("POINT 只能是 1~4")}
  {% endif %}
  G90
  G1 Z1 F600
  G1 X{points[p][0]} Y{points[p][1]} F6000
  G1 Z0.2 F300
  RESPOND MSG="点{p} {points[p][2]} X{points[p][0]} Y{points[p][1]} Z=0.2, 请用塞尺测试"

# 振动补偿测试: 未归零时先归零 -> 在热床中心测 X/Y 共振 -> 提示保存
# 需要上位机安装 numpy: ~/klippy-env/bin/pip install numpy
[gcode_macro SHAPER_TEST]
description: 【调试】振动补偿（input shaper）测试, 可选 AXIS=X/Y（默认两轴都测）
gcode:
  {% if 'resonance_tester' not in printer.configfile.settings %}
    {action_raise_error("未配置 [resonance_tester]")}
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  {% set x = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
  {% set y = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}
  {% if params.AXIS is defined %}
  SHAPER_CALIBRATE POINT={x},{y},20 AXIS={params.AXIS}
  {% else %}
  SHAPER_CALIBRATE POINT={x},{y},20
  {% endif %}
  RESPOND MSG="振动补偿测试完成, 确认推荐值后执行 SAVE_CONFIG 保存"
