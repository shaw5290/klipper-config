#####################################################################
# 模块：打印启停流程
#
# PRINT_START。调平、网床、热床升温、换头步骤会按已引用的模块自动判断。
#   单头：PRINT_START BED=<热床温度> EXTRUDER=<喷嘴温度>
#   多头（OrcaSlicer）：PRINT_START BED=<热床温度> INITIAL_TOOL=<首个工具>
#        T0_TEMP=<T0首层温度> T0_USED=<T0是否用到> T1_TEMP=... T1_USED=...
#        [CALIBRATE=1]  打印前对用到的工具自动对刀（T0 为基准总会校准）
#        CALIBRATE 默认 0：每次打印不修改校准值（偏移用手动校准保存的）；确实要打印前对刀时传 CALIBRATE=1
#   OrcaSlicer 设置见 docs/OrcaSlicer多热端设置.md
#
# 依赖：无
# 提供：PRINT_START（及 PRINT_START_HOME/LEVEL/TAP/CALIBRATE/MESH/TOOL 六个步骤）、PRINT_END、CANCEL_PRINT（覆盖内置命令，取消时关闭加热；模型风扇等热端降温后再关）
#####################################################################

# 一个宏从开始到结束是一条命令，执行期间不会插入其它命令（包括取消打印）。
# 所以打印开始拆成 6 个步骤宏：在切片软件里分行写，取消会在当前步骤结束后立即生效；
# 也可以只写一行 PRINT_START（依次调用 6 个步骤，用法不变，但取消要等全部做完）。
#   PRINT_START_HOME      BED=                       热床升温、归零、等热床
#   PRINT_START_LEVEL                                三点调平、重新 Z 归零
#   PRINT_START_TAP       [TAP=]                     喷嘴 150°C 后 tap 定 Z（喷嘴真实接触热床的位置为 Z=0）
#                         【调试阶段】TAP 默认 0（跳过）；需要时传 TAP=1，或把下面 default(0) 改回 default(1)
#   PRINT_START_CALIBRATE INITIAL_TOOL= Tn_USED= [CALIBRATE=]   多头打印前对刀
#   PRINT_START_MESH      [MESH=]                    加载保存的网床（MESH=1 才重新扫床）
#   PRINT_START_TOOL      INITIAL_TOOL= Tn_TEMP= Tn_USED= / EXTRUDER= [PURGE=]   换上首个工具并升温，画预挤出线（PURGE=0 跳过）

[gcode_macro PRINT_START]
description: 【打印】打印开始（单行写法）：依次执行 HOME → LEVEL → TAP → CALIBRATE → MESH → TOOL
gcode:
    PRINT_START_HOME {rawparams}
    PRINT_START_LEVEL
    PRINT_START_TAP {rawparams}
    PRINT_START_CALIBRATE {rawparams}
    PRINT_START_MESH {rawparams}
    PRINT_START_TOOL {rawparams}

[gcode_macro PRINT_START_HOME]
description: 【打印】打印开始步骤 1：热床升温、归零、等热床（参数 BED）
gcode:
    UPDATE_DELAYED_GCODE ID=_COOLDOWN_FAN DURATION=0    ; 停止上一次打印结束后的降温检查
    {% set BED_TEMP = params.BED|default(0)|float %}
    {% if BED_TEMP > 0 and 'heater_bed' in printer %}
    M140 S{BED_TEMP}       ; 热床开始升温（不等待）
    {% endif %}
    G28                    ; 归零
    G90                    ; 绝对坐标
    {% if BED_TEMP > 0 and 'heater_bed' in printer %}
    M190 S{BED_TEMP}       ; 热床到温后再调平、扫床
    {% endif %}

[gcode_macro PRINT_START_LEVEL]
description: 【打印】打印开始步骤 2：三点调平、重新 Z 归零（未引用调平模块时跳过）
gcode:
    {% if 'z_tilt' in printer %}
    Z_TILT_ADJUST          ; 三点调平
    G28 Z                  ; 调平后重新Z归零
    {% endif %}

[gcode_macro PRINT_START_TAP]
description: 【打印】打印开始步骤 2.5：喷嘴加热到 150°C 后用 tap 定 Z（参数 TAP，调试阶段默认跳过）
gcode:
    {% set TAP = params.TAP|default(0)|int %}    # 【调试阶段】默认跳过 tap，正式使用改回 default(1)
    {% if not TAP %}
    RESPOND MSG="PRINT_START: 跳过 tap 定 Z（需要时传 TAP=1）"
    {% elif 'probe_eddy_current eddy_probe' in printer.configfile.settings and 'gcode_macro SET_Z_FROM_PROBE' in printer %}
        {% if 'multitool' in printer %}
    T0                                     ; 多头：用基准工具 T0 定 Z，其它工具的 Z 偏移相对 T0
    M109 T0 S150                           ; 150°C 软化喷嘴残料，tap 更准
        {% else %}
    M109 S150
        {% endif %}
    G90
    G1 Z5 F600
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
    SET_Z_FROM_PROBE METHOD=tap            ; 第一次：把 Z=0 修正到喷嘴真实接触点
    SET_Z_FROM_PROBE METHOD=tap            ; 第二次：确认（教程建议多执行一次提升稳定性）
    {% endif %}

[gcode_macro PRINT_START_CALIBRATE]
description: 【打印】打印开始步骤 3：多头打印前对刀（参数 INITIAL_TOOL、Tn_USED、CALIBRATE）
gcode:
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% set CALIBRATE = params.CALIBRATE|default(0)|int %}    # 默认不对刀：每次打印不修改校准值，用手动校准保存的偏移；确实要打印前对刀时传 CALIBRATE=1
    {% if 'multitool' in printer and CALIBRATE and 'gcode_macro CALIBRATE_TOOL' in printer %}
        {% set cal_tools = [0] %}
        {% for n in range(1, 10) %}
            {% if ('T%d_USED' % n) in params and params['T%d_USED' % n]|lower in ['true', '1'] %}
                {% set _ = cal_tools.append(n) %}
            {% endif %}
        {% endfor %}
        {% if INITIAL_TOOL not in cal_tools %}
            {% set _ = cal_tools.append(INITIAL_TOOL) %}
        {% endif %}
    RESPOND MSG="PRINT_START: 打印前对刀 T{cal_tools|join(', T')}（T0 为基准）"
        {% for n in cal_tools %}
    CALIBRATE_TOOL TOOL={n}                ; 换头 → 加热 150°C → tap 测 Z（只用来算扫描高度）→ 线圈测 XY → 只保存 XY 偏移
        {% endfor %}
        {% for n in cal_tools %}
            {% if n != INITIAL_TOOL %}
    M104 S0 T{n}                           ; 对刀后关闭非首个工具，避免在坞里渗料（换头前由 Orca Ooze 预热）
            {% endif %}
        {% endfor %}
    {% endif %}

[gcode_macro PRINT_START_MESH]
description: 【打印】打印开始步骤 4：加载保存的网床（默认不重新扫描，不修改校准值；MESH=1 才重新扫床）
gcode:
    {% if 'bed_mesh' in printer %}
        {% if params.MESH|default(0)|int %}
    BED_MESH_CALIBRATE     ; 重新扫床（只在这次打印中用，不会自动保存）
        {% elif 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=default   ; 用 SAVE_CONFIG 保存过的网床，每次打印不修改
        {% else %}
    RESPOND TYPE=error MSG="PRINT_START: 没有保存的网床 default，本次不做网床补偿。先手动 BED_MESH_CALIBRATE 再 SAVE_CONFIG"
        {% endif %}
    {% endif %}

[gcode_macro PRINT_START_TOOL]
description: 【打印】打印开始步骤 5：换上首个工具并等到温（多头 INITIAL_TOOL/Tn_TEMP/Tn_USED；单头 EXTRUDER）
gcode:
    {% set MULTI = 'multitool' in printer %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% if MULTI %}
        {% set FIRST_TEMP = params['T%d_TEMP' % INITIAL_TOOL]|default(params.EXTRUDER|default(200))|float %}
        {% set used = [] %}
        {% for n in range(10) %}
            {% if ('T%d_USED' % n) in params and params['T%d_USED' % n]|lower in ['true', '1'] %}
                {% set _ = used.append('T%d' % n) %}
            {% endif %}
        {% endfor %}
    RESPOND MSG="PRINT_START: 首个工具 T{INITIAL_TOOL}（{FIRST_TEMP}°C），用到的工具: {used|join(', ') if used else '未知'}"
    T{INITIAL_TOOL}                        ; 多头：换上首个工具（插件自动加载对刀偏移）
    M109 T{INITIAL_TOOL} S{FIRST_TEMP}     ; 等首个工具到温；其它工具由 Orca 的 Ooze 预热在换头前加热
    {% else %}
        {% set FIRST_TEMP = params['T%d_TEMP' % INITIAL_TOOL]|default(params.EXTRUDER|default(200))|float %}
    RESPOND MSG="PRINT_START: 单头喷嘴温度 {FIRST_TEMP}°C"
    M109 S{FIRST_TEMP}                     ; 单头：等喷嘴到温（读 Tn_TEMP，其次 EXTRUDER，都没有才用 200）
    {% endif %}
    {% if params.PURGE|default(1)|int %}
    _PURGE_LINE                            ; 热床前边缘画预挤出线（像 A1 / P1），PURGE=0 跳过
    {% else %}
    G92 E0                 ; 重置挤出机
    G1 Z5 F3000            ; 抬高 Z 轴
    G1 X10 Y10 F3000       ; 移到起始位
    {% endif %}


# ---------------------------------------------------------
# 预挤出线：开始打印前在热床前边缘先挤一小坨，再画一条来回的粗线，最后回抽、擦嘴
# 多头时由 PRINT_START_TOOL 在换上首个工具、到温之后调用，其它工具由擦拭塔预挤出
# ---------------------------------------------------------
[gcode_macro _PURGE_LINE]
description: 【打印】开始打印前在热床前边缘画一条预挤出线（像 A1 / P1）：挤一小坨 → 来回画粗线 → 回抽擦嘴
gcode:
    {% set th = printer.toolhead %}
    {% set y = 3.0 %}                                    # 热床前边缘，在网床和模型范围外
    {% set x0 = 20.0 %}
    {% set x1 = [th.axis_maximum.x - 20, 200.0]|min %}   # 线长约 180 mm
    {% set epm = 0.075 %}                                # 每 mm 挤出长度：线宽约 0.6、层高 0.3（1.75 耗材）
    {% set len1 = x1 - x0 %}
    G90
    M83
    G92 E0
    G1 Z5 F600
    G1 X{x0} Y{y} F6000
    G1 Z0.3 F600
    G1 E8 F240                                           ; 先挤一小坨，把喷嘴里的料理顺
    G1 X{x0 + 20} E{(20 * epm * 2)|round(3)} F1200       ; 起头加粗，把小坨拉开
    G1 X{x1} E{((len1 - 20) * epm)|round(3)} F2400       ; 粗线
    G1 Y{y + 0.6} F3000
    G1 X{x1 - 60} E{(60 * epm)|round(3)} F2400           ; 折回再画一段
    G1 E-0.8 F1800                                       ; 回抽
    G1 X{x1 - 90} F6000                                  ; 横着擦一下喷嘴
    G1 Z2 F600
    G92 E0

# ---------------------------------------------------------
# 打印结束 / 取消共用：回抽、抬升、关闭所有加热；模型风扇全速吹到热端降温后再关
# ---------------------------------------------------------
[gcode_macro _PRINT_END_COMMON]
description: 【打印】打印结束/取消共用动作：回抽、抬升 Z、关闭所有加热器；模型风扇等热端降温后再关
gcode:
    {% set th = printer.toolhead %}
    {% set ext = printer[th.extruder] if th.extruder in printer else none %}
    G91
    {% if ext and ext.can_extrude %}
    G1 E-2 F1800                           ; 回抽，减少渗料（喷嘴温度够时才回抽）
    {% endif %}
    {% if 'z' in th.homed_axes %}
    G1 Z{[10, th.axis_maximum.z - th.position.z]|min} F600   ; 抬升 Z（不超过行程）
    {% endif %}
    G90
    TURN_OFF_HEATERS                       ; 关闭所有加热器（热床 + 所有热端）
    M106 S255                              ; 模型风扇全速，帮助热端降温
    UPDATE_DELAYED_GCODE ID=_COOLDOWN_FAN DURATION=10   ; 每 10 秒检查一次，所有热端低于 50°C 再关风扇

# 降温检查：所有热端都低于阈值后关闭模型风扇（不阻塞，取消打印可立即完成）
[delayed_gcode _COOLDOWN_FAN]
gcode:
    {% set threshold = 50.0 %}
    {% set temps = [] %}
    {% for i in range(0, 10) %}
        {% set name = 'extruder' if i == 0 else 'extruder%d' % i %}
        {% if name in printer %}
            {% set _ = temps.append(printer[name].temperature) %}
        {% endif %}
    {% endfor %}
    {% if temps and temps|max > threshold %}
    UPDATE_DELAYED_GCODE ID=_COOLDOWN_FAN DURATION=10
    {% else %}
    M107
    RESPOND MSG="热端已降到 {threshold}°C 以下，模型风扇关闭"
    {% endif %}

# 打印结束：OrcaSlicer 结束 G-code 填 PRINT_END
[gcode_macro PRINT_END]
description: 【打印】打印结束：回抽、抬升、关闭加热和风扇
gcode:
    _PRINT_END_COMMON
    M400

# 取消打印：覆盖 [pause_resume] 内置的 CANCEL_PRINT（内置版本不会关闭加热）
[gcode_macro CANCEL_PRINT]
description: 【打印】取消打印：回抽、抬升、关闭加热和风扇
rename_existing: BASE_CANCEL_PRINT
gcode:
    _PRINT_END_COMMON
    BASE_CANCEL_PRINT
