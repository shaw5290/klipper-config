#####################################################################
# 模块：打印启停流程
#
# PRINT_START。调平、网床、热床升温步骤会按已引用的模块自动跳过。
#
# 依赖：无
# 提供：PRINT_START
#####################################################################

[gcode_macro PRINT_START]
gcode:
    # 获取切片软件传过来的参数
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
    {% set BED_TEMP = params.BED|default(0)|float %}
    
    # 打印前基础动作
    G28                    ; 归零
    G90                    ; 绝对坐标

    # 热床升温（调试阶段已注释，正式打印时取消注释）
    # {% if BED_TEMP > 0 and 'heater_bed' in printer %}
    # M190 S{BED_TEMP}       ; 等待热床达到目标温度
    # {% endif %}

    # 调平与网床（未引用对应模块时自动跳过）
    {% if 'z_tilt' in printer %}
    Z_TILT_ADJUST          ; 三点调平
    G28 Z                  ; 调平后重新Z归零
    {% endif %}
    {% if 'bed_mesh' in printer %}
    BED_MESH_CALIBRATE     ; 扫床
    {% endif %}

    # 喷头升温（调试阶段已注释，正式打印时取消注释）
    # M104 S{EXTRUDER_TEMP}  ; 设置喷头温度并继续
    # M109 S{EXTRUDER_TEMP}  ; 等待喷头达到目标温度
    
    # 打印准备
    G92 E0                 ; 重置挤出机
    G1 Z5 F3000            ; 抬高 Z 轴
    G1 X10 Y10 F3000       ; 移到起始位
    ; 可以加一小段抽丝或擦拭动作（可选）
