#####################################################################
# 机型清单：多热端
#
# 本文件只列出要引用的模块。
# 更换某个部件：把对应的 include 换成新模块。
# 不需要某个功能：注释掉对应的 include，相关宏会自动跳过该步骤。
#####################################################################

# ---------- 基础（必需） ----------
[include modules/core/mainboard.cfg]          # 主板、XY 运动
[include modules/core/z_trident.cfg]          # 三 Z 丝杆（需要下方一个 Z 限位模块）
[include modules/core/heater_bed.cfg]         # 热床
[include modules/core/common.cfg]             # 通用功能

# ---------- 工具头 ----------
[include modules/toolhead/tgl36v3.cfg]        # TGL36V3 工具头 CAN 板

# ---------- 多热端 ----------
[include modules/multitool/multihotend.cfg]          # 多热端扩展板、T0 挤出机、T1..T7 热端
[include modules/multitool/multitool_plugin.cfg]     # 多热端切换插件
[include modules/multitool/changer_cxchanger.cfg]    # 换头方案：CxChanger（更换方案只替换这一行）
[include modules/multitool/tool_calibrate_eddy.cfg]  # 多热端偏移校准（涡流对刀，可选）

# ---------- 探针 / Z 限位（二选一） ----------
[include modules/probe/eddy_tgl36v3.cfg]      # 涡流探针 + Z 虚拟限位
# [include modules/probe/z_endstop_switch.cfg] # Z 物理限位开关

# ---------- 调平与网床（可选） ----------
[include modules/leveling/z_tilt.cfg]         # 三点调平
[include modules/leveling/bed_mesh.cfg]       # 网床补偿

# ---------- 宏（可选） ----------
[include modules/macros/print.cfg]            # 打印启停流程
[include modules/macros/maintenance.cfg]      # 日常维护与调试

# ---------- 多头专用的行程覆盖（必须放在所有 include 之后） ----------
# 停靠坞在热床前方（tN_dock_y: -20），换头时 Y 会走到负值，单头不需要。
# 同名段写在后面会覆盖前面模块里的值，只影响多头机型。
[stepper_y]
position_min: -30          # 【待测试】停靠坞 Y 在 -20～-30 之间，实测后改为：最深的 dock_y 再留 3～5mm；必须先确认工具头能物理到达
